global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/reglas-o-alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          componente: 'prometheus-tsdb'
          capa: 'monitoreo'

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          componente: 'host-docker'
          capa: 'infraestructura'

  # API REST integrada del Hito 10 exponiendo /metrics (aplicación + 6 adaptadores NoSQL)
  - job_name: fixture-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          componente: 'api-integrada'
          capa: 'aplicacion'
