name: dash

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fixture2030-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/reglas-o-alertas.yml:/etc/prometheus/reglas-o-alertas.yml:ro
      - ${HOME:-.}/docker/data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.3.1
    container_name: fixture2030-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # La contraseña se lee de .env (ignorado por git). scripts/iniciar_monitoreo.* lo genera
      # con un valor aleatorio si no existe; ver .env.example.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Definir GRAFANA_ADMIN_PASSWORD en .env (ver .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${HOME:-.}/docker/data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: fixture2030-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
