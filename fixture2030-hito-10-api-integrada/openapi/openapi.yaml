          - P-001
          title: Codigo Partido
        description: Código de negocio del partido.
      - name: ventana
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{12}$
          description: Minuto AAAAMMDDHHMM (UTC).
          examples:
          - '203006152016'
          title: Ventana
        description: Minuto AAAAMMDDHHMM (UTC).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          - type: 'null'
          description: cursor_siguiente.
          title: Cursor
        description: cursor_siguiente.
      responses:
