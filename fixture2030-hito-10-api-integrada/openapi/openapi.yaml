      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCambioEstado'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              example:
                error:
                  codigo: RECURSO_NO_ENCONTRADO
                  mensaje: No existe la selección 'XYZ'.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Conflicto con el estado actual del recurso o de la clave de idempotencia.
          content:
            application/json:
              example:
                error:
                  codigo: CONFLICTO_ESTADO
                  mensaje: 'No se puede pasar de ''Finalizado'' a ''En Juego''. Transiciones permitidas:
                    Programado -> En Juego -> Finalizado.'
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - estado_actual: Finalizado
                    estado_pedido: En Juego
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos-oficiales/{codigo_partido}/eventos:
    post:
      tags:
      - Actas oficiales (IRIS)
      summary: CU15 - Registrar un evento en el acta
      description: 'La regla ''un partido Finalizado no admite eventos'' la aplica `Fixture.Evento:%OnBeforeSave`
        y se informa como 409. Exige `Idempotency-Key`: un reintento con la misma clave devuelve 200 con
        el mismo resultado sin duplicar el evento.'
      operationId: registrar_evento_partidos_oficiales__codigo_partido__eventos_post
      parameters:
      - name: codigo_partido
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{3}$
          description: Código de negocio del partido.
          examples:
          - P-001
          title: Codigo Partido
        description: Código de negocio del partido.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          description: UUID generado por el cliente. Reintentar con la misma clave no duplica la escritura.
          examples:
          - 3f2b8c1e-6d4a-4e2b-9c7d-1a2b3c4d5e6f
          title: Idempotency-Key
        description: UUID generado por el cliente. Reintentar con la misma clave no duplica la escritura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoNuevo'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoRegistrado'
        '200':
          description: 'Repetición con la misma Idempotency-Key: no se volvió a escribir.'
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoRegistrado'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              example:
                error:
                  codigo: RECURSO_NO_ENCONTRADO
                  mensaje: No existe la selección 'XYZ'.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Conflicto con el estado actual del recurso o de la clave de idempotencia.
          content:
            application/json:
              example:
                error:
                  codigo: CONFLICTO_ESTADO
                  mensaje: 'El partido está Finalizado: el acta no admite eventos nuevos.'
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /health:
    get:
      tags:
      - Salud
      summary: CU16 - Disponibilidad de las seis fuentes
      description: Ejecuta una operación trivial en cada fuente, en paralelo y con el timeout de cada
        adaptador. 200 si todas responden; 503 si al menos una falla, indicando cuál.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: Al menos una fuente no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
