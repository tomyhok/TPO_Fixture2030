<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture 2030</title>
<style>
  /* Estética limpia con la paleta del Mundial 2030: rojo, verde y dorado de los anfitriones
     (Marruecos, Portugal, España), celeste del Centenario (Uruguay, Argentina) y azul marino
     para texto y acciones. Tema claro: el logo oficial tiene fondo blanco. */
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f6f7f9; --text: #0e1525; --muted: #667085; --line: #e4e7ec;
    --navy: #0a1f44; --rojo: #c8102e; --verde: #00843d; --oro: #f2b705; --celeste: #6cace4;
    --brand: var(--navy); --brand-text: #ffffff; --accent: var(--navy); --accent-text: #ffffff; --link: var(--navy);
    --ok: var(--verde); --warn: #b7791f; --err: var(--rojo); --chip: #eef0f4;
    --mongodb: #3f9142; --neo4j: #0d7fd8; --cassandra: #1287b1; --redis: #d82c20; --influxdb: #9b4dca;
    --franja: linear-gradient(90deg, var(--rojo) 0 25%, var(--verde) 25% 50%, var(--oro) 50% 75%, var(--celeste) 75%);
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; font-weight: 600; } a:hover { text-decoration: underline; text-underline-offset: 3px; }
  button, input, select { font: inherit; }
  .cont { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* cabecera */
  .top { background: #fff; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); }
  .top::before { content: ""; display: block; height: 4px; background: var(--franja); }
  .top .cont { display: flex; align-items: center; gap: 24px; height: 78px; }
  .marca { display: flex; align-items: center; gap: 12px; color: var(--navy); }
  .marca:hover { text-decoration: none; }
  .marca img { height: 68px; width: auto; display: block; }
  .marca span { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; line-height: 1.2; border-left: 1px solid var(--line); padding-left: 12px; }
  nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
  nav a { color: var(--muted); padding: 8px 12px; white-space: nowrap; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--navy); text-decoration: none; }
  nav a.activo { color: var(--navy); border-bottom-color: var(--rojo); }
  .usuario { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 14px; }
  .usuario small { color: var(--muted); }
  .btn { border: 1px solid transparent; border-radius: 999px; padding: 8px 18px; cursor: pointer; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 14px; transition: opacity .15s; }
  .btn:hover { opacity: .88; }
  .btn.sec { background: transparent; border-color: var(--line); color: var(--text); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  main.cont { padding-top: 32px; padding-bottom: 56px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; font-weight: 800; letter-spacing: -.02em; color: var(--navy); }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 800; color: var(--navy); }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radio); padding: 20px; }
  .cabpanel { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
  .cabpanel h2 { margin: 0; }
  .fuente { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .fuente i { width: 7px; height: 7px; border-radius: 50%; }
  .grid { display: grid; gap: 18px; }
  .g2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 860px) { .g2 { grid-template-columns: 1fr; } .usuario small, .marca span { display: none; } .top .cont { gap: 12px; } }
  .vacio { color: var(--muted); margin: 4px 0; }

  /* portada del fixture */
  .portada { display: flex; align-items: center; gap: 24px; margin-bottom: 26px; }
  .portada::after { content: ""; flex: 0 0 120px; height: 6px; border-radius: 3px; background: var(--franja); align-self: center; margin-left: auto; }
  @media (max-width: 700px) { .portada::after { display: none; } }
  .portada h1 { margin: 0; }
  .portada p { margin: 4px 0 0; color: var(--muted); }

  /* fixture */
  .partidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .partido { display: block; color: inherit; font-weight: 400; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radio); padding: 16px; transition: border-color .15s, box-shadow .15s; }
  .partido:hover { border-color: var(--navy); text-decoration: none; box-shadow: 0 6px 20px rgba(10, 31, 68, .08); }
  .partido .meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .eq { display: flex; align-items: center; gap: 9px; font-weight: 700; min-width: 0; color: var(--text); }
  .eq.der { flex-direction: row-reverse; text-align: right; }
  .eq b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .escudo { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; letter-spacing: .4px; }
  .escudo.g { width: 60px; height: 60px; font-size: 15px; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
  .escudo.bandera { display: block; object-fit: cover; background: #fff; box-shadow: 0 0 0 1px rgba(10, 31, 68, .14); }
  .escudo.bandera.g { box-shadow: 0 0 0 3px rgba(255, 255, 255, .28); }
  .banderita { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; vertical-align: -4px; box-shadow: 0 0 0 1px rgba(10, 31, 68, .14); }
  .usuario .escudo { width: 28px; height: 28px; font-size: 9px; }
  .muestra-linea { display: inline-block; width: 18px; border-top: 3px solid; vertical-align: middle; margin-right: 2px; }
  .marcador { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 0 6px; color: var(--navy); letter-spacing: -.01em; }
  .estado { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); display: inline-flex; align-items: center; }
  .estado.vivo { color: var(--rojo); background: #fdecee; }
  .estado.fin { color: var(--navy); background: #e8edf6; }
  .grupos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .grupo h3 { margin: 0 0 8px; font-size: 15px; font-weight: 800; color: var(--navy); }
  .fila-eq { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 8px; color: inherit; font-weight: 500; }
  .fila-eq:hover { background: var(--panel-2); text-decoration: none; }
  .fila-eq .escudo { width: 24px; height: 24px; font-size: 9px; }
  .fila-eq small { margin-left: auto; color: var(--muted); }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .filtros select { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-weight: 600; }
  .filtro { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .filtro:hover { border-color: var(--navy); }
  .filtro.activo { background: var(--navy); color: #fff; border-color: var(--navy); }
  .dia { margin: 26px 0 10px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grupos-pos { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  table.tabla-grupo { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.tabla-grupo th { color: var(--muted); font-weight: 700; font-size: 11px; text-align: right; padding: 4px; letter-spacing: .04em; }
  table.tabla-grupo th:nth-child(2) { text-align: left; }
  table.tabla-grupo td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--line); }
  table.tabla-grupo td:nth-child(2) { text-align: left; }
  table.tabla-grupo tr.clasifica td:first-child { box-shadow: inset 3px 0 var(--verde); }
  table.tabla-grupo a { color: inherit; display: flex; align-items: center; gap: 7px; font-weight: 600; }
  table.tabla-grupo .escudo { width: 22px; height: 22px; font-size: 8px; }
  .buscador { width: 100%; max-width: 360px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text); }
  .buscador:focus, .filtros select:focus { outline: 2px solid var(--navy); outline-offset: 1px; }

  /* partido */
  .hero { position: relative; overflow: hidden; background: var(--navy); color: #fff; border-radius: 18px; padding: 28px 22px 26px; margin-bottom: 18px; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--franja); }
  .hero .versus { gap: 16px; }
  .hero .eq { font-size: 19px; color: #fff; }
  .hero a.eq:hover { text-decoration: none; opacity: .9; }
  .hero .marcador { font-size: 46px; color: #fff; }
  .hero .info { text-align: center; color: #b9c4d8; font-size: 13px; margin-top: 14px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .hero .estado { color: #fff; background: rgba(255,255,255,.12); }
  .vivo-strip { display: flex; gap: 20px; justify-content: center; margin-top: 12px; font-size: 13px; color: #b9c4d8; flex-wrap: wrap; }
  .vivo-strip b { color: #fff; font-variant-numeric: tabular-nums; }
  .demo-estado { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: #b9c4d8; }
  .demo-estado .btn { padding: 6px 14px; font-size: 13px; color: #fff; border-color: rgba(255,255,255,.35); }
  .centro { display: grid; justify-items: center; gap: 2px; }
  .reloj { font-size: 14px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; min-height: 20px; display: flex; align-items: center; }
  .reloj.fin { color: #b9c4d8; font-weight: 600; }
  .hero .marcador.gol { animation: golazo 1.2s ease-out; }
  @keyframes golazo { 25% { transform: scale(1.3); color: var(--oro); } }
  .linea li.nuevo { animation: entrar .5s ease-out; outline: 1px solid var(--navy); }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff4d5e; margin-right: 6px; animation: latir 1.4s infinite; }
  @keyframes latir { 50% { opacity: .3; } }
  .muro-form { display: grid; gap: 8px; margin-bottom: 14px; }
  .muro-form textarea { width: 100%; min-height: 70px; resize: vertical; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit; }
  .muro-form textarea:focus { outline: 2px solid var(--navy); outline-offset: 1px; background: #fff; }
  .muro-form .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muro-form select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .contador { margin-left: auto; color: var(--muted); font-size: 12px; }
  .comentarios { display: grid; gap: 8px; max-height: 560px; overflow: auto; }
  .comentario { border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; background: var(--panel); }
  .comentario.nuevo { animation: entrar .5s ease-out; border-color: var(--navy); }
  .comentario.relator { border-left: 4px solid var(--oro); background: #fffbeb; }
  @keyframes entrar { from { opacity: 0; transform: translateY(-4px); } }
  .comentario .cab { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .comentario .cab small { color: var(--muted); margin-left: auto; }
  .comentario p { margin: 4px 0 0; overflow-wrap: anywhere; }
  .tag { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; color: #fff; letter-spacing: .04em; }
  .linea { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .linea li { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); }
  .linea .min { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--navy); }
  .stats-tabla { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
  .stats-tabla td { padding: 7px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .stats-tabla td:first-child, .stats-tabla td:last-child { width: 25%; font-weight: 800; }
  .stats-tabla td:last-child { text-align: right; }
  .stats-tabla td:nth-child(2) { text-align: center; color: var(--muted); font-size: 13px; }
  svg.grafico { width: 100%; height: auto; display: block; }
  svg.grafico text { fill: var(--muted); font: 11px system-ui, sans-serif; }

  /* prode */
  .prode-form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-bottom: 12px; }
  .prode-form .eq { font-size: 14px; }
  .goles { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .goles input { width: 54px; padding: 8px 4px; text-align: center; font-size: 22px; font-weight: 800; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--navy); font-variant-numeric: tabular-nums; }
  .goles input:focus { outline: 2px solid var(--navy); outline-offset: 1px; background: #fff; }
  .prode-acc { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .reparto { display: flex; height: 28px; border-radius: 999px; overflow: hidden; font-size: 12px; font-weight: 800; color: #fff; margin: 8px 0 6px; background: var(--panel-2); }
  .reparto div { display: grid; place-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
  .reparto .e { background: #98a2b3; }
  .leyenda { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--chip); font-variant-numeric: tabular-nums; font-weight: 600; }
  .pts { font-size: 12px; font-weight: 800; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .pts.exacto { background: var(--verde); color: #fff; }
  .pts.resultado { background: #e6f4ec; color: var(--verde); }
  .pts.ninguno, .pts.pend { background: var(--chip); color: var(--muted); }
  table.posiciones td, table.posiciones th { font-variant-numeric: tabular-nums; }
  table.posiciones td.n, table.posiciones th.n { text-align: right; }
  table.posiciones tr.yo td { background: #eef2f9; font-weight: 800; }
  table.posiciones .alias { display: flex; align-items: center; gap: 8px; }
  table.posiciones .escudo { width: 22px; height: 22px; font-size: 8px; }
  .abierto { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; color: inherit; font-weight: 400; background: var(--panel); }
  .abierto:hover { border-color: var(--navy); text-decoration: none; }
  .abierto .vs { flex: 1; min-width: 0; font-weight: 700; }
  .abierto small { color: var(--muted); display: block; font-weight: 400; }

  /* selección */
  .ficha { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .datos { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .datos b { color: var(--navy); display: block; font-size: 18px; }
  table.plantel { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.plantel th { text-align: left; color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  table.plantel td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .tabla-scroll { overflow-x: auto; }

  /* logs del sistema (Cassandra) */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .kpi small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .kpi b { font-size: 22px; color: var(--navy); font-variant-numeric: tabular-nums; }
  .kpi.alerta b { color: var(--err); }
  .logs-barra { margin-bottom: 14px; }
  .logs-barra .buscador { max-width: 280px; padding: 8px 14px; }
  .g-logs { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 980px) { .g-logs { grid-template-columns: 1fr; } }
  .logs-lista { max-height: 640px; overflow: auto; }
  table.logs { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.logs th { position: sticky; top: 0; background: var(--panel); text-align: left; color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px; border-bottom: 1px solid var(--line); }
  table.logs td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.logs tr.nuevo td { animation: resaltar 1.6s ease-out; }
  table.logs tr.sel td { background: #eef2f9; }
  @keyframes resaltar { from { background: #fff7d6; } }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
  td.hora { color: var(--muted); white-space: nowrap; }
  .nivel { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; letter-spacing: .04em; background: var(--chip); color: var(--muted); }
  .nivel.WARNING { background: #fdf3e1; color: var(--warn); }
  .nivel.ERROR, .nivel.CRITICAL { background: #fdecee; color: var(--err); }
  .origen { font-size: 12px; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .detalle { overflow-wrap: anywhere; }
  .detalle small { color: var(--muted); }
  .rid { border: 0; background: none; padding: 0; margin-top: 2px; color: var(--link); cursor: pointer; text-align: left; }
  .rid:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    table.logs thead { display: none; }
    table.logs tr { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); }
    table.logs tr.sel { background: #eef2f9; }
    table.logs td { padding: 0; border: 0; background: transparent !important; }
    table.logs td.detalle { grid-column: 1 / -1; }
  }
  ol.traza { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ol.traza li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); font-size: 13px; }
  ol.traza .t { color: var(--muted); }

  /* modal y avisos */
  dialog { border: 0; border-radius: 18px; background: var(--panel); color: var(--text); padding: 24px; width: min(420px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(10, 31, 68, .25); }
  dialog::backdrop { background: rgba(10, 31, 68, .45); }
  dialog form { display: grid; gap: 14px; }
  dialog label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
  dialog input, dialog select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .acciones { display: flex; gap: 8px; justify-content: flex-end; }
  #avisos { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 20; max-width: calc(100vw - 32px); }
  .aviso { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--verde); border-radius: 12px; padding: 11px 14px; box-shadow: 0 10px 30px rgba(10, 31, 68, .12); font-size: 14px; max-width: 360px; }
  .aviso.err { border-left-color: var(--rojo); }
  .aviso small { display: block; color: var(--muted); font-size: 11px; }
  .pie { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0 30px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header class="top">
  <div class="cont">
    <a class="marca" href="#/" aria-label="Inicio"><img src="img/logo-mundial-2030.webp" alt="FIFA World Cup 2030"><span>Fixture<br>2030</span></a>
    <nav>
      <a href="#/" data-nav="fixture">Fixture</a>
      <a href="#/grupos" data-nav="grupos">Grupos</a>
      <a href="#/selecciones" data-nav="selecciones">Selecciones</a>
      <a href="#/prode" data-nav="prode">Prode</a>
      <a href="#/logs" data-nav="logs">Logs</a>
      <a href="../demo/">Integración</a>
      <a href="../docs" target="_blank" rel="noopener">API</a>
    </nav>
    <div class="usuario" id="usuario"></div>
  </div>
</header>

<main class="cont" id="app"></main>
<div class="pie cont">Portal de demostración del TPO · Datos servidos por MongoDB, Neo4j, Cassandra, Redis e InfluxDB a través de la API.</div>

<dialog id="dlg-login">
  <form id="form-login">
    <h2 style="margin:0">Ingresar al portal</h2>
    <p class="sub" style="margin:0">Se crea una sesión en Redis (<code>sesion:&lt;id&gt;</code>) que vence a los 30 minutos.</p>
    <label>Alias <input name="alias" required minlength="3" maxlength="24" pattern="[\w .\-]+" placeholder="hincha_celeste"></label>
    <label>Selección favorita <select name="equipo_favorito" id="sel-favorito"><option value="">Ninguna</option></select></label>
    <div class="acciones">
      <button class="btn sec" type="button" id="btn-cancelar">Cancelar</button>
      <button class="btn" type="submit">Ingresar</button>
    </div>
  </form>
</dialog>
<div id="avisos" aria-live="polite"></div>

<script>
// ===================================================================== utilidades
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FUENTES = { mongodb: "MongoDB", neo4j: "Neo4j", cassandra: "Cassandra", redis: "Redis", influxdb: "InfluxDB" };
// Base de datos de la que sale cada bloque: un punto con el color de la base y su nombre.
const fuente = (...bs) => `<span style="display:inline-flex;gap:10px;flex-wrap:wrap">${bs.map(b => `<span class="fuente"><i style="background:var(--${b})"></i>${FUENTES[b]}</span>`).join("")}</span>`;
const COLORES = { ARG: "#4a90c8", ESP: "#c60b1e", URU: "#1e4fa8", BRA: "#139a43", POR: "#8a1538", MAR: "#c1272d", PAR: "#d52b1e", FRA: "#21468b", ALE: "#3d3d3d", ENG: "#9b1c2c" };
function colorEquipo(iso) {
  if (COLORES[iso]) return COLORES[iso];
  let h = 0; for (const c of iso) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 40%)`;
}
// Código FIFA -> ISO 3166 de los íconos de img/banderas (flag-icons 7.2.3, licencia MIT en LICENSE.txt).
// Una selección sin bandera conserva el círculo de color con su sigla.
const BANDERAS = {
  ARG: "ar", NED: "nl", ROU: "ro", IRN: "ir", BRA: "br", BEL: "be", GRE: "gr", AUS: "au",
  URU: "uy", CRO: "hr", MAR: "ma", KSA: "sa", COL: "co", DEN: "dk", SEN: "sn", QAT: "qa",
  ECU: "ec", SUI: "ch", EGY: "eg", IRQ: "iq", CHI: "cl", AUT: "at", ALG: "dz", UZB: "uz",
  PAR: "py", POL: "pl", NGA: "ng", JOR: "jo", PER: "pe", UKR: "ua", TUN: "tn", CHN: "cn",
  BOL: "bo", SWE: "se", CMR: "cm", USA: "us", VEN: "ve", NOR: "no", CIV: "ci", MEX: "mx",
  ESP: "es", SRB: "rs", GHA: "gh", CAN: "ca", POR: "pt", TUR: "tr", MLI: "ml", CRC: "cr",
  FRA: "fr", SCO: "gb-sct", RSA: "za", JAM: "jm", ENG: "gb-eng", CZE: "cz", COD: "cd", PAN: "pa",
  GER: "de", HUN: "hu", JPN: "jp", NZL: "nz", ITA: "it", WAL: "gb-wls", KOR: "kr", NCL: "nc",
};
const urlBandera = (iso) => BANDERAS[iso] ? `img/banderas/${BANDERAS[iso]}.svg` : null;
const escudo = (iso, grande) => urlBandera(iso)
  ? `<img class="escudo bandera${grande ? " g" : ""}" src="${urlBandera(iso)}" alt="${esc(iso)}" title="${esc(iso)}" loading="lazy">`
  : `<span class="escudo${grande ? " g" : ""}" style="background:${colorEquipo(iso)}">${esc(iso)}</span>`;
const banderita = (iso) => urlBandera(iso)
  ? `<img class="banderita" src="${urlBandera(iso)}" alt="${esc(iso)}" title="${esc(iso)}">`
  : `<span class="tag" style="background:${colorEquipo(iso)}">${esc(iso)}</span>`;
const fechaLarga = (f) => f ? new Date(f + "T12:00:00Z").toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "long", year: "numeric" }) : "Fecha a definir";

function avisar(texto, error = false, detalle = "") {
  const d = document.createElement("div");
  d.className = "aviso" + (error ? " err" : "");
  d.innerHTML = esc(texto) + (detalle ? `<small>${esc(detalle)}</small>` : "");
  $("#avisos").appendChild(d);
  setTimeout(() => d.remove(), error ? 7000 : 3500);
}

// --------------------------------------------------------------- sesión local
const CLAVE = "fx2030.sesion";
const guardar = (id) => { try { id ? localStorage.setItem(CLAVE, id) : localStorage.removeItem(CLAVE); } catch {} };
const recuperar = () => { try { return localStorage.getItem(CLAVE); } catch { return null; } };
let sesion = null; // SesionPortal vigente

class ErrorApi extends Error { constructor(status, cuerpo) { super(cuerpo?.error?.mensaje || `HTTP ${status}`); this.status = status; this.codigo = cuerpo?.error?.codigo; this.requestId = cuerpo?.error?.request_id; } }

async function api(ruta, { metodo = "GET", cuerpo } = {}) {
  const headers = { Accept: "application/json" };
  if (cuerpo !== undefined) headers["Content-Type"] = "application/json";
  if (sesion) headers["X-Sesion-ID"] = sesion.id_sesion;
  const r = await fetch(ruta, { method: metodo, headers, body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo) });
  if (r.status === 204) return null;
  const datos = await r.json().catch(() => null);
  if (!r.ok) {
    if (r.status === 401) { cerrarSesionLocal(); abrirLogin(); }
    throw new ErrorApi(r.status, datos);
  }
  return datos;
}
const avisarError = (e) => avisar(e.message, true, e.codigo ? `${e.codigo}${e.requestId ? " · " + e.requestId.slice(0, 8) : ""}` : "");

// --------------------------------------------------------------- caché simple
const cache = {};
const unaVez = (clave, fn) => (cache[clave] ??= fn().catch((e) => { delete cache[clave]; throw e; }));
const partidos = () => unaVez("partidos", () => api("/portal/api/partidos"));
const equipos = () => unaVez("equipos", () => api("/portal/api/equipos"));
const nombreEquipo = async (iso) => (await equipos().catch(() => [])).find(e => e.codigo_iso === iso)?.nombre ?? iso;

// ===================================================================== sesión UI
function pintarUsuario() {
  const u = $("#usuario");
  if (!sesion) {
    u.innerHTML = `<button class="btn" id="btn-login">Ingresar</button>`;
    $("#btn-login").onclick = abrirLogin;
    return;
  }
  const min = sesion.ttl_restante_s != null ? Math.max(0, Math.round(sesion.ttl_restante_s / 60)) : "∞";
  const fav = sesion.equipo_favorito;
  u.innerHTML = `${fav ? escudo(fav) : ""}
    <span><b>${esc(sesion.alias)}</b> <small>${esc(sesion.id_sesion)} · ${min} min</small></span>
    <button class="btn sec" id="btn-salir">Salir</button>`;
  $("#btn-salir").onclick = async () => {
    try { await api(`/portal/api/sesiones/${sesion.id_sesion}`, { metodo: "DELETE" }); } catch {}
    cerrarSesionLocal(); avisar("Sesión cerrada (clave eliminada de Redis)."); ruta();
  };
}
function cerrarSesionLocal() { sesion = null; guardar(null); pintarUsuario(); }

async function abrirLogin() {
  const sel = $("#sel-favorito");
  if (sel.options.length <= 1) {
    const lista = await equipos().catch(() => []);
    sel.insertAdjacentHTML("beforeend", lista.slice().sort((a, b) => a.nombre.localeCompare(b.nombre))
      .map(e => `<option value="${esc(e.codigo_iso)}">${esc(e.nombre)}</option>`).join(""));
  }
  if (!$("#dlg-login").open) $("#dlg-login").showModal();
}
$("#btn-cancelar").onclick = () => $("#dlg-login").close();
$("#form-login").onsubmit = async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    sesion = await api("/portal/api/sesiones", { metodo: "POST", cuerpo: { alias: f.get("alias"), equipo_favorito: f.get("equipo_favorito") || null } });
    guardar(sesion.id_sesion);
    $("#dlg-login").close(); ev.target.reset();
    pintarUsuario(); avisar(`Hola ${sesion.alias}: sesión ${sesion.id_sesion} creada en Redis.`);
    ruta();
  } catch (e) { avisarError(e); }
};

async function restaurarSesion() {
  const id = recuperar();
  if (!id) return pintarUsuario();
  try { sesion = await api(`/portal/api/sesiones/${encodeURIComponent(id)}`); }
  catch { sesion = null; guardar(null); }
  pintarUsuario();
}
setInterval(async () => { // refresca el TTL mostrado y detecta vencimientos
  if (!sesion) return;
  try { sesion = await api(`/portal/api/sesiones/${sesion.id_sesion}`); pintarUsuario(); }
  catch (e) { if (e.status === 404) { cerrarSesionLocal(); avisar("Tu sesión venció en Redis.", true); } }
}, 30000);

// ===================================================================== router
let timers = [];
const limpiarTimers = () => { timers.forEach(clearInterval); timers = []; };
async function ruta() {
  limpiarTimers();
  const [_, seccion, id] = (location.hash || "#/").split("/");
  document.querySelectorAll("nav a[data-nav]").forEach(a => a.classList.toggle("activo",
    a.dataset.nav === (seccion === "selecciones" || seccion === "seleccion" ? "selecciones" : seccion === "prode" ? "prode" : seccion === "logs" ? "logs" : seccion === "grupos" ? "grupos" : seccion === "" || seccion === "partido" ? "fixture" : "")));
  const app = $("#app");
  app.innerHTML = `<p class="vacio">Cargando…</p>`;
  try {
    if (seccion === "partido" && id) await vistaPartido(app, decodeURIComponent(id));
    else if (seccion === "seleccion" && id) await vistaSeleccion(app, decodeURIComponent(id));
    else if (seccion === "selecciones") await vistaSelecciones(app);
    else if (seccion === "prode") await vistaProde(app);
    else if (seccion === "grupos") await vistaGrupos(app);
    else if (seccion === "logs") await vistaLogs(app);
    else await vistaFixture(app);
  } catch (e) {
    app.innerHTML = `<div class="panel"><h2>No se pudo cargar la página</h2><p>${esc(e.message)}</p><p class="vacio">${esc(e.codigo ?? "")}</p></div>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", ruta);

// ===================================================================== vistas
const claseEstado = (est) => est === "En Juego" ? "vivo" : est === "Finalizado" ? "fin" : "";
const etiquetaFase = (p) => p.grupo ? `Grupo ${p.grupo} · Fecha ${p.jornada}` : (p.fase ?? "");
function tarjetaPartido(p) {
  const [loc, vis] = ordenEquipos(p);
  const goles = p.estado === "Programado" ? null : p.goles;
  const est = p.estado ?? "Programado";
  const claseEst = claseEstado(est);
  return `<a class="partido" href="#/partido/${esc(p.codigo_partido)}">
    <div class="meta"><span>${esc(etiquetaFase(p))} · ${esc(p.codigo_partido)}</span><span class="estado ${claseEst}">${claseEst === "vivo" ? '<span class="punto"></span>' : ""}${esc(est)}</span></div>
    <div class="versus">
      <div class="eq">${escudo(loc.codigo_iso)}<b>${esc(loc.nombre ?? loc.codigo_iso)}</b></div>
      <div class="marcador">${goles ? `${goles[loc.codigo_iso] ?? 0} - ${goles[vis.codigo_iso] ?? 0}` : "vs"}</div>
      <div class="eq der">${escudo(vis.codigo_iso)}<b>${esc(vis.nombre ?? vis.codigo_iso)}</b></div>
    </div>
    <div class="meta" style="margin:10px 0 0">${esc(fechaLarga(p.fecha))}<span>${esc(p.sede?.nombre ?? "")}${p.sede?.ciudad ? ", " + esc(p.sede.ciudad) : ""}</span></div>
  </a>`;
}
const ordenEquipos = (p) => {
  const eqs = p.equipos.slice().sort((a, b) => (a.condicion === "local" ? -1 : 1) - (b.condicion === "local" ? -1 : 1));
  return [eqs[0] ?? { codigo_iso: "?" }, eqs[1] ?? { codigo_iso: "?" }];
};
async function golesPartido(codigo) {
  const r = await api(`/partidos/${codigo}/eventos?limit=200`).catch(() => null);
  if (!r) return null;
  const g = {};
  for (const ev of r.eventos) if (/^gol/i.test(ev.tipo) && ev.jugador) { const iso = ev.jugador.id_jugador.split("-")[0]; g[iso] = (g[iso] ?? 0) + 1; }
  return { goles: g, eventos: r.eventos };
}

// Posiciones de un grupo con los partidos finalizados (goles de Neo4j, selecciones de MongoDB).
// Orden: puntos, diferencia de gol, goles a favor y, sin partidos jugados, ranking FIFA.
function posicionesGrupo(letra, eqs, lista) {
  const filas = new Map(eqs.filter(e => e.grupo === letra).map(e => [e.codigo_iso, { e, pj: 0, g: 0, em: 0, p: 0, gf: 0, gc: 0, pts: 0 }]));
  for (const pa of lista) {
    if (pa.grupo !== letra || pa.estado !== "Finalizado") continue;
    const [l, v] = ordenEquipos(pa);
    const gl = pa.goles[l.codigo_iso] ?? 0, gv = pa.goles[v.codigo_iso] ?? 0;
    for (const [iso, a, b] of [[l.codigo_iso, gl, gv], [v.codigo_iso, gv, gl]]) {
      const f = filas.get(iso);
      if (!f) continue;
      f.pj++; f.gf += a; f.gc += b;
      if (a > b) { f.g++; f.pts += 3; } else if (a === b) { f.em++; f.pts += 1; } else f.p++;
    }
  }
  return [...filas.values()].sort((x, y) => y.pts - x.pts || (y.gf - y.gc) - (x.gf - x.gc) || y.gf - x.gf || x.e.ranking_fifa - y.e.ranking_fifa);
}

const filtroFixture = { grupo: "", estado: "" }; // se conserva al volver al fixture
async function vistaFixture(app) {
  const [lista, eqs] = await Promise.all([partidos(), equipos().catch(() => [])]);
  const letras = [...new Set(eqs.map(e => e.grupo))].sort();
  const ESTADOS = [["", "Todos"], ["En Juego", "En juego"], ["Programado", "Programados"], ["Finalizado", "Finalizados"]];
  app.innerHTML = `
    <div class="portada"><div><h1>Copa Mundial de la FIFA 2030</h1>
      <p>Marruecos · Portugal · España, con el Centenario en Uruguay, Argentina y Paraguay. Elegí un partido para seguirlo en vivo o <a href="#/prode">jugá al prode</a>.</p></div></div>
    <div class="cabpanel"><h2>Partidos</h2>${fuente("neo4j")}</div>
    <div class="filtros">
      <select id="f-grupo" aria-label="Grupo">
        <option value="">Todos los grupos</option>${letras.map(l => `<option value="${esc(l)}">Grupo ${esc(l)}</option>`).join("")}
        <option value="-">Partidos de muestra (hitos 5–8)</option>
      </select>
      ${ESTADOS.map(([v, t]) => `<button class="filtro" data-estado="${esc(v)}">${t}</button>`).join("")}
      <small style="color:var(--muted)" id="f-cuenta"></small>
    </div>
    <div id="lista-partidos"></div>`;

  const pintar = () => {
    const visibles = lista.filter(p => (!filtroFixture.grupo || (filtroFixture.grupo === "-" ? !p.grupo : p.grupo === filtroFixture.grupo))
      && (!filtroFixture.estado || p.estado === filtroFixture.estado));
    const porDia = new Map();
    for (const p of visibles) { if (!porDia.has(p.fecha)) porDia.set(p.fecha, []); porDia.get(p.fecha).push(p); }
    $("#lista-partidos").innerHTML = visibles.length
      ? [...porDia].map(([dia, ps]) => `<div class="dia">${esc(fechaLarga(dia))}</div><div class="partidos">${ps.map(tarjetaPartido).join("")}</div>`).join("")
      : '<p class="vacio">No hay partidos con ese filtro.</p>';
    $("#f-cuenta").textContent = `${visibles.length} partido${visibles.length === 1 ? "" : "s"}`;
    document.querySelectorAll(".filtro").forEach(b => b.classList.toggle("activo", b.dataset.estado === filtroFixture.estado));
  };
  $("#f-grupo").value = filtroFixture.grupo;
  $("#f-grupo").onchange = (e) => { filtroFixture.grupo = e.target.value; pintar(); };
  document.querySelectorAll(".filtro").forEach(b => b.onclick = () => { filtroFixture.estado = b.dataset.estado; pintar(); });
  pintar();
}

async function vistaGrupos(app) {
  const [lista, eqs] = await Promise.all([partidos(), equipos().catch(() => [])]);
  const letras = [...new Set(eqs.map(e => e.grupo))].sort();
  const deGrupo = lista.filter(p => p.grupo);
  const jugados = deGrupo.filter(p => p.estado === "Finalizado").length;
  const enJuego = deGrupo.filter(p => p.estado === "En Juego").length;
  const dg = (f) => `${f.gf - f.gc > 0 ? "+" : ""}${f.gf - f.gc}`;
  app.innerHTML = `
    <h1>Fase de grupos</h1>
    <p class="sub">${jugados} de ${deGrupo.length} partidos jugados${enJuego ? ` · ${enJuego} en juego` : ""}. Clasifican los dos primeros de cada grupo.
      Cuentan solo los partidos finalizados. ${fuente("neo4j", "mongodb")}</p>
    <div class="grupos grupos-pos">${letras.map(g => `<div class="panel grupo">
      <div class="cabpanel" style="margin-bottom:8px"><h3 style="margin:0">Grupo ${esc(g)}</h3><a href="#/" data-grupo="${esc(g)}" style="font-size:13px">Ver partidos</a></div>
      <div class="tabla-scroll"><table class="tabla-grupo"><thead><tr><th>#</th><th>Selección</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>
      ${posicionesGrupo(g, eqs, lista).map((f, i) => `<tr class="${i < 2 && f.pj ? "clasifica" : ""}"><td>${i + 1}</td>
        <td><a href="#/seleccion/${esc(f.e.codigo_iso)}">${escudo(f.e.codigo_iso)}${esc(f.e.nombre)}</a></td>
        <td>${f.pj}</td><td>${f.g}</td><td>${f.em}</td><td>${f.p}</td><td>${f.gf}</td><td>${f.gc}</td><td>${dg(f)}</td><td><b>${f.pts}</b></td></tr>`).join("")}
      </tbody></table></div></div>`).join("")}</div>`;
  // "Ver partidos" abre el fixture ya filtrado por ese grupo.
  document.querySelectorAll("[data-grupo]").forEach(a => a.addEventListener("click", () => {
    filtroFixture.grupo = a.dataset.grupo;
    filtroFixture.estado = "";
  }));
}

async function vistaSelecciones(app) {
  const eqs = await equipos();
  app.innerHTML = `<h1>Selecciones</h1><p class="sub">${eqs.length} selecciones clasificadas ${fuente("mongodb")}</p>
    <input class="buscador" id="buscar" placeholder="Buscar por nombre, código o confederación" autocomplete="off">
    <div class="grupos" id="lista-sel" style="margin-top:14px"></div>`;
  const pintar = (q) => {
    const t = q.trim().toLowerCase();
    const f = eqs.filter(e => !t || [e.nombre, e.codigo_iso, e.confederacion].some(v => v.toLowerCase().includes(t)));
    $("#lista-sel").innerHTML = f.map(e => `<a class="partido" href="#/seleccion/${esc(e.codigo_iso)}" style="display:flex;gap:12px;align-items:center">
      ${escudo(e.codigo_iso)}<div><b>${esc(e.nombre)}</b><div style="color:var(--muted);font-size:13px">${esc(e.confederacion)} · Grupo ${esc(e.grupo)} · Ranking #${e.ranking_fifa}</div></div></a>`).join("")
      || `<p class="vacio">Ninguna selección coincide con “${esc(q)}”.</p>`;
  };
  $("#buscar").oninput = (e) => pintar(e.target.value);
  pintar("");
}

async function vistaSeleccion(app, iso) {
  const [pl, lista] = await Promise.all([api(`/portal/api/equipos/${encodeURIComponent(iso)}/plantel`), partidos().catch(() => [])]);
  const e = pl.equipo;
  const suyos = lista.filter(p => p.equipos.some(x => x.codigo_iso === iso));
  const orden = ["ARQ", "DEF", "MED", "DEL"];
  const jug = pl.jugadores.slice().sort((a, b) => (orden.indexOf(a.posicion) - orden.indexOf(b.posicion)) || (a.dorsal - b.dorsal));
  app.innerHTML = `
    <div class="panel" style="margin-bottom:16px"><div class="ficha">${escudo(e.codigo_iso, true)}
      <div><h1>${esc(e.nombre)}</h1><div class="datos">
        <span>Confederación<b>${esc(e.confederacion)}</b></span><span>Grupo<b>${esc(e.grupo)}</b></span>
        <span>Ranking FIFA<b>#${e.ranking_fifa}</b></span><span>DT<b>${esc(e.director_tecnico ?? "—")}</b></span>
        ${e.pais_anfitrion ? "<span>Condición<b>Anfitrión</b></span>" : ""}</div></div>
      <div style="margin-left:auto">${fuente("mongodb")}</div></div></div>
    <div class="grid g2">
      <div class="panel"><div class="cabpanel"><h2>Plantel (${jug.length})</h2>${fuente("mongodb")}</div>
        <div class="tabla-scroll"><table class="plantel"><thead><tr><th>#</th><th>Jugador</th><th>Pos.</th><th>Edad</th><th>Club</th></tr></thead>
        <tbody>${jug.map(j => `<tr><td>${j.dorsal ?? ""}</td><td>${esc(j.nombre)}</td><td>${esc(j.posicion ?? "")}</td><td>${j.edad ?? ""}</td><td>${esc(j.club_actual ?? "")}</td></tr>`).join("")}</tbody></table></div></div>
      <div class="panel"><div class="cabpanel"><h2>Partidos</h2>${fuente("neo4j")}</div>
        ${suyos.length ? `<div class="grid">${suyos.map(tarjetaPartido).join("")}</div>` : '<p class="vacio">Todavía no tiene partidos cargados en el fixture.</p>'}</div>
    </div>`;
}

// ------------------------------------------------------------------- partido
async function vistaPartido(app, codigo) {
  const lista = await partidos();
  const p = lista.find(x => x.codigo_partido === codigo);
  if (!p) throw new ErrorApi(404, { error: { mensaje: `No existe el partido ${codigo}.`, codigo: "RECURSO_NO_ENCONTRADO" } });
  const [loc, vis] = ordenEquipos(p);
  const ev = await golesPartido(codigo);
  const goles = ev?.goles ?? {};
  const est = p.estado ?? "Programado";
  const siguientes = { "Programado": ["En Juego", "Finalizado"], "En Juego": ["Finalizado"] }[est] ?? [];
  app.innerHTML = `
    <section class="hero">
      <div class="versus">
        <a class="eq" href="#/seleccion/${esc(loc.codigo_iso)}">${escudo(loc.codigo_iso, true)}<b>${esc(loc.nombre ?? loc.codigo_iso)}</b></a>
        <div class="centro"><div class="marcador" id="marcador">${goles[loc.codigo_iso] ?? 0} - ${goles[vis.codigo_iso] ?? 0}</div>
          <div class="reloj" id="reloj"></div></div>
        <a class="eq der" href="#/seleccion/${esc(vis.codigo_iso)}">${escudo(vis.codigo_iso, true)}<b>${esc(vis.nombre ?? vis.codigo_iso)}</b></a>
      </div>
      <div class="info">
        <span class="estado">${est === "En Juego" ? '<span class="punto"></span>' : ""}${esc(est)}</span>
        <span>${esc(fechaLarga(p.fecha))}</span><span>${esc(p.sede?.nombre ?? "")}${p.sede?.ciudad ? ", " + esc(p.sede.ciudad) : ""}</span>
        <span>${esc(etiquetaFase(p))}</span>${p.arbitro ? `<span>Árbitro: ${esc(p.arbitro.nombre)} ${esc(p.arbitro.apellido)}</span>` : ""}
      </div>
      <div class="vivo-strip" id="vivo"><span>Cargando datos en vivo…</span></div>
      ${sesion && siguientes.length ? `<div class="demo-estado" id="demo-estado"><span>Control de la demo:</span>
        ${siguientes.map(e => `<button class="btn sec" data-estado="${esc(e)}" title="${e === "En Juego" ? "Simula los 90 minutos en tiempo real: eventos en Neo4j, estadísticas en InfluxDB, relato en Cassandra y reloj en Redis" : "Cierra el partido en Neo4j"}">${e === "En Juego" ? "▶ Iniciar partido (simulación)" : "Finalizar partido"}</button>`).join("")}</div>` : ""}
    </section>
    <div class="grid g2">
      <div class="grid">
        <div class="panel">
          <div class="cabpanel"><h2>Muro de hinchas</h2>${fuente("cassandra", "redis")}</div>
          <div id="muro-form"></div>
          <div class="comentarios" id="muro"><p class="vacio">Cargando comentarios…</p></div>
          <p style="margin:10px 0 0;font-size:13px"><a href="#" id="ver-muestra">Ver comentarios de la muestra del Hito 6 (ventana 15/06 20:16)</a></p>
        </div>
      </div>
      <div class="grid">
        <div class="panel"><div class="cabpanel"><h2>Prode</h2>${fuente("mongodb", "neo4j")}</div><div id="prode"><p class="vacio">Cargando…</p></div></div>
        <div class="panel"><div class="cabpanel"><h2>Estadísticas</h2>${fuente("influxdb")}</div><div id="stats"><p class="vacio">Cargando…</p></div></div>
        <div class="panel"><div class="cabpanel"><h2>Cronología</h2>${fuente("neo4j")}</div><div id="cronologia"></div></div>
      </div>
    </div>`;

  pintarCronologia(ev?.eventos ?? []);
  document.querySelectorAll("[data-estado]").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      const nuevo = await api(`/portal/api/partidos/${codigo}/estado`, { metodo: "PUT", cuerpo: { estado: b.dataset.estado } });
      delete cache.partidos; // el fixture cacheado quedó con el estado anterior
      avisar(`${codigo} ahora está ${nuevo.estado} (Neo4j).`);
      ruta();
    } catch (e) { avisarError(e); b.disabled = false; }
  }));
  pintarFormMuro(codigo, [loc, vis]);
  pintarEstadisticas(codigo, p, [loc, vis]);
  pintarProde(codigo, loc, vis);
  $("#ver-muestra").onclick = async (e) => { e.preventDefault(); await cargarMuestra(codigo); };

  let ultimoVivo = null;
  const refrescarVivo = async (visita) => {
    try {
      const v = await api(`/portal/api/partidos/${codigo}/${visita ? "visitas" : "vivo"}`, visita ? { metodo: "POST" } : {});
      ultimoVivo = v;
      $("#vivo").innerHTML = `<span><span class="punto"></span>Visitas <b>${v.visitas.toLocaleString("es-AR")}</b></span>
        <span>Conectados <b>${v.conectados}</b></span>
        <span style="opacity:.8">Redis · contador y set</span>`;
      await actualizarReloj(v.reloj);
    } catch (e) { $("#vivo").innerHTML = `<span>Datos en vivo no disponibles: ${esc(e.message)}</span>`; }
  };
  // Partido simulado: el reloj vive en Redis; con cada minuto nuevo se releen los eventos
  // (Neo4j) y, cada 3 s, las estadísticas (InfluxDB). Al terminar se recarga la página.
  let simCorriendo = false, ultimoMinuto = null, ultimasStats = 0, golesVistos = Object.values(goles).reduce((a, b) => a + b, 0);
  const eventosVistos = new Set((ev?.eventos ?? []).map(e => e.id_evento));
  const actualizarReloj = async (reloj) => {
    const el = $("#reloj");
    if (!el) return;
    if (!reloj) { el.textContent = ""; return; }
    if (!reloj.en_curso) {
      el.className = "reloj fin";
      el.textContent = est === "Finalizado" ? `Final · ${formatoMinuto(reloj.minuto)}` : formatoMinuto(reloj.minuto);
      if (simCorriendo) { simCorriendo = false; delete cache.partidos; avisar("¡Terminó el partido! Estado Finalizado en Neo4j."); ruta(); }
      return;
    }
    simCorriendo = true;
    $("#demo-estado")?.remove();
    el.className = "reloj";
    el.innerHTML = `<span class="punto"></span>${formatoMinuto(reloj.minuto)}${reloj.minuto >= 90 ? ` <small style="opacity:.75;margin-left:4px">(+${reloj.adicion})</small>` : ""}`;
    if (reloj.minuto === ultimoMinuto) return;
    ultimoMinuto = reloj.minuto;
    const r = await golesPartido(codigo);
    if (r) {
      const total = Object.values(r.goles).reduce((a, b) => a + b, 0);
      const m = $("#marcador");
      if (m) m.textContent = `${r.goles[loc.codigo_iso] ?? 0} - ${r.goles[vis.codigo_iso] ?? 0}`;
      if (total > golesVistos && m) {
        const gol = r.eventos.filter(e => /^gol/i.test(e.tipo)).at(-1);
        m.classList.remove("gol"); void m.offsetWidth; m.classList.add("gol");
        avisar(`⚽ ¡Gol${gol?.jugador ? ` de ${gol.jugador.nombre}` : ""}! (${formatoMinuto(gol?.minuto ?? reloj.minuto)})`);
      }
      golesVistos = total;
      pintarCronologia(r.eventos, eventosVistos);
    }
    if (Date.now() - ultimasStats > 3000) { ultimasStats = Date.now(); pintarEstadisticas(codigo, p, [loc, vis]); }
  };
  const vistos = new Set();
  const refrescarMuro = async () => {
    try {
      const m = await api(`/portal/api/partidos/${codigo}/muro?limit=40`);
      const primera = vistos.size === 0;
      $("#muro").innerHTML = m.items.length ? m.items.map(c => {
        const nuevo = !primera && !vistos.has(c.id_comentario);
        vistos.add(c.id_comentario);
        return htmlComentario(c, nuevo);
      }).join("") : `<p class="vacio">Nadie comentó en los últimos 15 minutos. ¡Sé el primero!</p>`;
      if (primera) m.items.forEach(c => vistos.add(c.id_comentario));
    } catch (e) { $("#muro").innerHTML = `<p class="vacio">Muro no disponible: ${esc(e.message)}</p>`; }
  };
  window.__refrescarMuro = refrescarMuro;
  window.__refrescarVivo = () => refrescarVivo(false);
  await Promise.all([refrescarVivo(true), refrescarMuro()]);
  // En juego se consulta más seguido para ver avanzar el reloj, el marcador y el muro.
  const enJuego = est === "En Juego";
  timers.push(setInterval(refrescarMuro, enJuego ? 2000 : 5000), setInterval(() => refrescarVivo(false), enJuego ? 1000 : 5000));
}

function htmlComentario(c, nuevo) {
  const hora = new Date(c.creado_en).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const propio = sesion && c.id_usuario === sesion.usuario_id;
  const relator = c.id_usuario === "U-0000"; // mensajes de la simulación del partido
  return `<div class="comentario${nuevo ? " nuevo" : ""}${relator ? " relator" : ""}">
    <div class="cab">${c.equipo_apoyado ? banderita(c.equipo_apoyado) : ""}
      <b>${relator ? "📣 " : ""}${esc(c.usuario_alias ?? c.id_usuario)}</b>${propio ? '<span class="fuente">vos</span>' : ""}
      <small>${c.minuto_partido != null ? formatoMinuto(c.minuto_partido) + " · " : ""}${hora}</small></div>
    <p>${esc(c.texto)}</p></div>`;
}

const ICONOS = { "Gol": "⚽", "Tarjeta Amarilla": "🟨", "Tarjeta Roja": "🟥" };
const formatoMinuto = (m) => m > 90 ? `90+${m - 90}'` : `${m}'`;
function pintarCronologia(eventos, vistos) {
  const items = eventos.map(e => ({ min: e.minuto, nuevo: vistos ? !vistos.has(e.id_evento) : false,
      txt: `${ICONOS[e.tipo] ? ICONOS[e.tipo] + " " : ""}${esc(e.tipo)}${e.jugador ? ` · ${esc(e.jugador.nombre)}` : ""}`, iso: e.jugador?.id_jugador.split("-")[0] }))
    .sort((a, b) => a.min - b.min);
  eventos.forEach(e => vistos?.add(e.id_evento));
  if (!$("#cronologia")) return;
  $("#cronologia").innerHTML = items.length ? `<ul class="linea">${items.map(i => `<li${i.nuevo ? ' class="nuevo"' : ""}><span class="min">${formatoMinuto(i.min)}</span>
    <span>${i.iso ? `${banderita(i.iso)} ` : ""}${i.txt}</span><span></span></li>`).join("")}</ul>`
    : '<p class="vacio">Sin eventos registrados.</p>';
}

async function pintarEstadisticas(codigo, p, eqs) {
  let cont = $("#stats");
  if (!cont) return;
  if (!p.fecha) { cont.innerHTML = '<p class="vacio">Partido sin fecha.</p>'; return; }
  // Partido simulado: las mediciones arrancan en la hora real de inicio (un punto por minuto de juego).
  const desde = p.inicio ?? `${p.fecha}T20:00:00Z`;
  const hasta = p.inicio ? new Date(Date.parse(p.inicio) + 2 * 3600e3).toISOString() : `${p.fecha}T22:00:00Z`;
  const resolucion = p.inicio ? "1m" : "5m";
  let r;
  try { r = await api(`/partidos/${codigo}/estadisticas?desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}&resolucion=${resolucion}`); }
  catch (e) { cont.innerHTML = `<p class="vacio">${esc(e.message)}</p>`; return; }
  cont = $("#stats"); // la consulta es asíncrona: el usuario pudo cambiar de página
  if (!cont) return;
  if (!r.series.length) { cont.innerHTML = '<p class="vacio">Sin mediciones para este partido.</p>'; return; }
  const serie = (iso) => r.series.find(s => s.equipo === iso)?.puntos ?? [];
  const [a, b] = eqs.map(e => e.codigo_iso);
  // Gráfico de posesión (%) en el tiempo
  const W = 480, H = 170, PL = 30, PR = 8, PT = 10, PB = 22;
  const todos = r.series.flatMap(s => s.puntos.map(x => new Date(x.instante).getTime()));
  const t0 = Math.min(...todos), t1 = Math.max(...todos) || t0 + 1;
  const X = (t) => PL + (W - PL - PR) * ((t - t0) / ((t1 - t0) || 1));
  const Y = (v) => PT + (H - PT - PB) * (1 - v / 100);
  const linea = (iso) => serie(iso).map((x, i) => `${i ? "L" : "M"}${X(new Date(x.instante).getTime()).toFixed(1)},${Y(x.posesion_pct_prom).toFixed(1)}`).join(" ");
  const ejeY = [0, 50, 100].map(v => `<line x1="${PL}" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v === 50 ? 'stroke-dasharray="4 4"' : ""}/><text x="${PL - 4}" y="${Y(v) + 4}" text-anchor="end">${v}%</text>`).join("");
  const mins = (t) => Math.round((t - t0) / 60000);
  const ejeX = [0, 0.5, 1].map(f => { const t = t0 + (t1 - t0) * f; return `<text x="${X(t)}" y="${H - 6}" text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}">${mins(t)}'</text>`; }).join("");
  const ultimo = (iso) => serie(iso).at(-1) ?? {};
  const ua = ultimo(a), ub = ultimo(b);
  const fila = (lbl, va, vb, fmt = (v) => v ?? "—") => `<tr><td style="color:${colorEquipo(a)}">${fmt(va)}</td><td>${lbl}</td><td style="color:${colorEquipo(b)}">${fmt(vb)}</td></tr>`;
  cont.innerHTML = `
    <div style="display:flex;gap:14px;font-size:13px;margin-bottom:4px">
      <span><span class="muestra-linea" style="border-top-color:${colorEquipo(a)}"></span> ${banderita(a)} posesión</span>
      <span><span class="muestra-linea" style="border-top-color:${colorEquipo(b)};border-top-style:dashed"></span> ${banderita(b)} posesión</span>
      <span style="margin-left:auto;color:var(--muted)">promedio cada ${resolucion === "1m" ? "minuto" : "5 min"}</span></div>
    <svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Posesión por equipo a lo largo del partido">
      ${ejeY}${ejeX}
      <path d="${linea(a)}" fill="none" stroke="${colorEquipo(a)}" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="${linea(b)}" fill="none" stroke="${colorEquipo(b)}" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 3"/>
    </svg>
    <table class="stats-tabla">
      ${fila("Posesión", ua.posesion_pct_prom, ub.posesion_pct_prom, (v) => v == null ? "—" : v.toFixed(1) + "%")}
      ${fila("Pases completados", ua.pases_completados_max, ub.pases_completados_max)}
      ${fila("Tiros", ua.tiros_max, ub.tiros_max)}
      ${fila("Hinchas siguiendo", ua.usuarios_activos_max, ub.usuarios_activos_max, (v) => v == null ? "—" : v.toLocaleString("es-AR"))}
    </table>`;
}

const ACIERTO = { exacto: "pleno", resultado: "acertó el resultado", ninguno: "sin acierto" };
const chipPuntos = (p) => p.puntos == null ? `<span class="pts pend">Pendiente</span>`
  : `<span class="pts ${esc(p.acierto)}">+${p.puntos} · ${ACIERTO[p.acierto] ?? ""}</span>`;
const momento = (f) => new Date(f).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

async function pintarProde(codigo, loc, vis) {
  const cont = $("#prode");
  if (!cont) return;
  let r;
  try { r = await api(`/portal/api/partidos/${codigo}/predicciones`); }
  catch (e) { cont.innerHTML = `<p class="vacio">Prode no disponible: ${esc(e.message)}</p>`; return; }
  if (!$("#prode")) return; // el usuario ya navegó a otra página
  const mia = r.mi_prediccion;
  const nombre = (e) => esc(e.nombre ?? e.codigo_iso);
  let accion;
  if (r.abierta && sesion) {
    accion = `<form id="form-prode">
      <div class="prode-form">
        <div class="eq">${escudo(loc.codigo_iso)}<b>${nombre(loc)}</b></div>
        <div class="goles"><input name="gl" type="number" min="0" max="20" required value="${mia?.goles_local ?? ""}" aria-label="Goles de ${nombre(loc)}">
          –<input name="gv" type="number" min="0" max="20" required value="${mia?.goles_visitante ?? ""}" aria-label="Goles de ${nombre(vis)}"></div>
        <div class="eq der">${escudo(vis.codigo_iso)}<b>${nombre(vis)}</b></div>
      </div>
      <div class="prode-acc"><button class="btn" type="submit">${mia ? "Actualizar pronóstico" : "Guardar pronóstico"}</button>
        <small style="color:var(--muted)">${mia ? `Guardado el ${esc(momento(mia.actualizada_en))} · ` : ""}Podés cambiarlo hasta que empiece el partido.</small></div>
    </form>`;
  } else if (r.abierta) {
    accion = `<div class="prode-acc"><button class="btn" id="login-prode">Ingresá para pronosticar</button>
      <small style="color:var(--muted)">3 pts el resultado exacto, 1 pt el ganador o el empate.</small></div>`;
  } else {
    const real = r.resultado_real;
    accion = `<p style="margin:0 0 8px">${real ? `Partido puntuado con el resultado <b>${real.goles_local} - ${real.goles_visitante}</b>.`
      : `Pronósticos cerrados: el partido está <b>${esc(r.estado)}</b>.`}</p>`
      + (mia ? `<p style="margin:0 0 12px">Tu pronóstico: <b>${mia.goles_local} - ${mia.goles_visitante}</b> ${chipPuntos(mia)}</p>`
             : `<p class="vacio" style="margin:0 0 12px">No pronosticaste este partido.</p>`);
  }
  const t = r.total;
  const seg = (n, cls, color, titulo) => n ? `<div class="${cls}" style="width:${(n / t * 100).toFixed(1)}%${color ? `;background:${color}` : ""}" title="${esc(titulo)}: ${n}">${Math.round(n / t * 100)}%</div>` : "";
  const reparto = t ? `<div style="font-size:13px;color:var(--muted)">${t === 1 ? "Qué pronosticó 1 hincha" : `Qué pronosticaron ${t} hinchas`}</div>
      <div class="reparto">${seg(r.local, "", colorEquipo(loc.codigo_iso), "Gana " + (loc.nombre ?? loc.codigo_iso))}${seg(r.empate, "e", "", "Empate")}${seg(r.visitante, "", colorEquipo(vis.codigo_iso), "Gana " + (vis.nombre ?? vis.codigo_iso))}</div>
      <div class="leyenda"><span>Gana ${esc(loc.codigo_iso)} · ${r.local}</span><span>Empate · ${r.empate}</span><span>Gana ${esc(vis.codigo_iso)} · ${r.visitante}</span></div>
      <div class="chips">${r.marcadores.map(m => `<span class="chip">${m.goles_local}-${m.goles_visitante} · ${m.cantidad} ${m.cantidad === 1 ? "voto" : "votos"}</span>`).join("")}</div>`
    : `<p class="vacio">Todavía nadie pronosticó este partido.</p>`;
  cont.innerHTML = accion + reparto;
  $("#login-prode")?.addEventListener("click", abrirLogin);
  $("#form-prode")?.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target, btn = f.querySelector("button"); btn.disabled = true;
    try {
      const p = await api(`/portal/api/partidos/${codigo}/prediccion`, { metodo: "PUT",
        cuerpo: { goles_local: Number(f.gl.value), goles_visitante: Number(f.gv.value) } });
      avisar(`Pronóstico ${p.goles_local} - ${p.goles_visitante} guardado en MongoDB.`);
      await pintarProde(codigo, loc, vis);
    } catch (e) { avisarError(e); btn.disabled = false; }
  });
}

  app.innerHTML = `

        <select id="hinchada" class="buscador" style="margin-bottom:12px" aria-label="Filtrar por hinchada">
          <option value="">General: todos los hinchas</option>
          ${eqs.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(e => `<option value="${esc(e.codigo_iso)}">Hinchas de ${esc(e.nombre)}</option>`).join("")}
        </select>
        <div id="tabla"><p class="vacio">Cargando…</p></div>
      </div>
      <div class="grid">
        <div class="panel"><div class="cabpanel"><h2>Para pronosticar</h2>${fuente("neo4j", "mongodb")}</div>
          ${abiertos.length ? `<div class="grid" style="gap:8px">${abiertos.map(p => {
            const [l, v] = ordenEquipos(p), m = mia.get(p.codigo_partido);
            return `<a class="abierto" href="#/partido/${esc(p.codigo_partido)}">${escudo(l.codigo_iso)}
              <span class="vs">${esc(l.nombre ?? l.codigo_iso)} vs ${esc(v.nombre ?? v.codigo_iso)}<small>${esc(fechaLarga(p.fecha))} · ${esc(etiquetaFase(p))} · <span style="white-space:nowrap">${esc(p.codigo_partido)}</span></small></span>
              ${escudo(v.codigo_iso)}<span class="pts ${m ? "resultado" : "exacto"}">${m ? `Tu pronóstico ${m.goles_local} - ${m.goles_visitante}` : "Pronosticar"}</span></a>`;
          }).join("")}</div>
          ${programados.length > abiertos.length ? `<p class="vacio" style="margin-top:10px">Y ${programados.length - abiertos.length} partidos programados más en el <a href="#/">fixture</a>.</p>` : ""}`
          : '<p class="vacio">No hay partidos programados.</p>'}</div>
        <div class="panel"><div class="cabpanel"><h2>Mis pronósticos</h2>${fuente("mongodb")}</div>
          ${!sesion ? `<button class="btn" id="login-mias">Ingresá para ver tus pronósticos</button>`
            : mias.length ? `<div class="tabla-scroll"><table class="plantel"><thead><tr><th>Partido</th><th>Pronóstico</th><th>Resultado</th><th>Puntos</th></tr></thead><tbody>
              ${mias.map(m => `<tr><td><a href="#/partido/${esc(m.codigo_partido)}">${esc(m.codigo_partido)}</a> <small style="color:var(--muted)">${esc(nombre(m.equipo_local))} vs ${esc(nombre(m.equipo_visitante))}</small></td>
                <td><b>${m.goles_local} - ${m.goles_visitante}</b></td>
                <td>${m.resultado_real ? `${m.resultado_real.goles_local} - ${m.resultado_real.goles_visitante}` : "—"}</td><td>${chipPuntos(m)}</td></tr>`).join("")}
              </tbody></table></div>`
            : '<p class="vacio">Todavía no pronosticaste ningún partido.</p>'}
        </div>
      </div>
    </div>`;
  $("#login-mias")?.addEventListener("click", abrirLogin);
  $("#hinchada").onchange = (e) => pintarTabla(e.target.value);
  await pintarTabla("");
}

async function pintarTabla(equipo) {
  const cont = $("#tabla");
  let t;
  try { t = await api(`/portal/api/posiciones?limit=50${equipo ? `&equipo=${encodeURIComponent(equipo)}` : ""}`); }
  catch (e) { cont.innerHTML = `<p class="vacio">Tabla no disponible: ${esc(e.message)}</p>`; return; }
  const fila = (f) => `<tr class="${sesion && f.usuario_id === sesion.usuario_id ? "yo" : ""}"><td>${f.posicion}</td>
    <td><span class="alias">${f.equipo_favorito ? escudo(f.equipo_favorito) : ""}${esc(f.alias)}</span></td>
    <td class="n"><b>${f.puntos}</b></td><td class="n">${f.exactos}</td><td class="n">${f.aciertos}</td><td class="n">${f.pronosticos}</td></tr>`;
  const fuera = t.mi_fila && !t.filas.some(f => f.usuario_id === t.mi_fila.usuario_id);
  cont.innerHTML = (t.filas.length ? `<div class="tabla-scroll"><table class="plantel posiciones">
      <thead><tr><th>#</th><th>Hincha</th><th class="n">Pts</th><th class="n">Plenos</th><th class="n">Aciertos</th><th class="n">Jugados</th></tr></thead>
      <tbody>${t.filas.map(fila).join("")}${fuera ? `<tr><td colspan="6" style="text-align:center;color:var(--muted)">…</td></tr>${fila(t.mi_fila)}` : ""}</tbody></table></div>
      <p style="margin:10px 0 0;font-size:13px;color:var(--muted)">${t.total_participantes} participante${t.total_participantes === 1 ? "" : "s"}. A igualdad de puntos, desempata la cantidad de plenos.</p>`
    : `<p class="vacio">${equipo ? "Ningún hincha de esa selección pronosticó todavía." : "Todavía no hay pronósticos."}</p>`)
    + (t.pendientes.length ? `<p class="vacio">Sin puntuar por ahora (Neo4j no respondió): ${t.pendientes.map(esc).join(", ")}.</p>` : "");
}

// ------------------------------------------------------------------- logs
// Visor de los logs que la API persiste en Cassandra (logs_api_por_hora / _por_request /
// _por_nivel). Las consultas de esta pantalla también generan logs: viajan con un
// X-Request-ID "visor-logs-…" y se ocultan siempre, igual que los archivos estáticos del portal,
// para no inundar la lista con su propio ruido.
const PREFIJO_VISOR = "visor-logs-";
const ORIGENES = { acceso: "HTTP", adaptador: "Base de datos", error: "Error", app: "API", "servicio.simulador": "Simulación", "servicio.prode": "Prode", "servicio.salud": "Salud" };
const origenLog = (logger) => { const k = String(logger).replace(/^fixture2030\./, ""); return ORIGENES[k] ?? k; };
const filtroLogs = { modo: "vivo", nivel: "", origen: "", texto: "", pausa: false };
// Archivos del propio portal (HTML, banderas, logo): mucho volumen y poco interés para seguir el sistema.
const esEstatico = (it) => it.metodo === "GET" && /^\/(portal\/(?!api\/)|demo\/|favicon\.ico$)/.test(it.ruta ?? "");
let secuenciaVisor = 0;
async function apiVisor(ruta, texto = false) {
  const r = await fetch(ruta, { headers: { Accept: texto ? "text/plain" : "application/json", "X-Request-ID": `${PREFIJO_VISOR}${Date.now().toString(36)}-${++secuenciaVisor}` } });
  if (!r.ok) throw new ErrorApi(r.status, await r.json().catch(() => null));
  return texto ? r.text() : r.json();
}
const ventanaUTC = () => new Date().toISOString().slice(0, 13).replace(/[-T]/g, ""); // AAAAMMDDHH
const fechaUTC = () => new Date().toISOString().slice(0, 10).replace(/-/g, "");      // AAAAMMDD
const horaLog = (iso) => { const d = new Date(iso); return `${d.toLocaleTimeString("es-AR", { hour12: false })}.${String(d.getMilliseconds()).padStart(3, "0")}`; };
const ms = (v) => `${Number(v).toLocaleString("es-AR", { maximumFractionDigits: 1 })} ms`;

function detalleLog(it) {
  const dur = it.duracion_ms != null ? ` · ${ms(it.duracion_ms)}` : "";
  const res = it.resultado && it.resultado !== "ok" ? ` · <span style="color:var(--err)">${esc(it.resultado)}</span>` : "";
  let html;
  if (it.metodo) {
    const s = it.status_http, color = s >= 500 ? "var(--err)" : s >= 400 ? "var(--warn)" : "var(--ok)";
    html = `<b>${esc(it.metodo)}</b> ${esc(it.ruta)} → <b style="color:${color}">${s ?? "—"}</b>${dur}${res}`;
  } else if (it.dependencia) {
    html = `<span class="fuente" style="font-size:12px;color:var(--text)"><i style="background:var(--${esc(it.dependencia)})"></i>${esc(FUENTES[it.dependencia] ?? it.dependencia)}</span> ${esc(it.operacion ?? "")}${dur}${res}`;
  } else {
    html = esc(it.mensaje);
  }
  if ((it.metodo || it.dependencia) && (it.nivel === "ERROR" || it.nivel === "CRITICAL")) html += `<br><small>${esc(it.mensaje)}</small>`;
  return html;
}

async function vistaLogs(app) {
  const vistos = new Map(); // id_log -> entrada (se recorta a las 1000 más recientes)
  let nuevos = new Set(), primera = true, generacion = 0, cargando = false, seleccion = null;
  app.innerHTML = `
    <h1>Logs del sistema</h1>
    <p class="sub">Cada request, consulta a una base y paso de las simulaciones queda guardado en Apache Cassandra.
      La lista se actualiza sola cada 2 segundos; los logs llegan con ~1 s de demora porque la API los escribe en lotes. ${fuente("cassandra")}</p>
    <div class="kpis" id="lg-kpis"></div>
    <div class="filtros logs-barra">
      <button class="filtro" data-modo="vivo" title="Tabla logs_api_por_hora (hora UTC actual)">En vivo · última hora</button>
      <button class="filtro" data-modo="incidentes" title="Tabla logs_api_por_nivel (WARNING, ERROR y CRITICAL de hoy)">Incidentes de hoy</button>
      <select id="lg-nivel" aria-label="Nivel"><option value="">Todos los niveles</option><option>INFO</option><option>WARNING</option><option>ERROR</option><option>CRITICAL</option></select>
      <select id="lg-origen" aria-label="Origen"><option value="">Todos los orígenes</option></select>
      <input class="buscador" id="lg-texto" placeholder="Buscar ruta, operación, mensaje o request ID" autocomplete="off">
      <button class="btn sec" id="lg-pausa"></button>
    </div>
    <div class="grid g-logs">
      <div class="panel">
        <div class="cabpanel"><h2 id="lg-titulo"></h2><small id="lg-estado" style="color:var(--muted)"></small></div>
        <div class="logs-lista" id="lg-lista"><p class="vacio">Cargando…</p></div>
      </div>
      <div class="panel">
        <div class="cabpanel"><h2>Traza de un request</h2>${fuente("cassandra")}</div>
        <div id="lg-traza"><p class="vacio">Tocá un request ID de la lista para ver, en orden, todo lo que hizo esa petición: el acceso HTTP y cada consulta a las bases (tabla <code>logs_api_por_request</code>).</p></div>
      </div>
    </div>`;

  const pintar = () => {
    const t = filtroLogs.texto.trim().toLowerCase();
    const todos = [...vistos.values()];
    const visibles = todos
      .filter(it => !it.request_id.startsWith(PREFIJO_VISOR) && !esEstatico(it))
      .filter(it => !filtroLogs.nivel || it.nivel === filtroLogs.nivel)
      .filter(it => !filtroLogs.origen || it.logger === filtroLogs.origen)
      .filter(it => !t || [it.ruta, it.operacion, it.mensaje, it.request_id, it.dependencia].some(v => v && String(v).toLowerCase().includes(t)))
      .sort((a, b) => b._t - a._t);

    // El selector de origen se arma con los loggers que fueron apareciendo.
    const sel = $("#lg-origen");
    const loggers = [...new Set(todos.map(it => it.logger))].sort();
    if (sel.options.length - 1 !== loggers.length) {
      sel.innerHTML = `<option value="">Todos los orígenes</option>` + loggers.map(l => `<option value="${esc(l)}">${esc(origenLog(l))}</option>`).join("");
      sel.value = filtroLogs.origen;
    }

    $("#lg-titulo").textContent = filtroLogs.modo === "vivo" ? `Última hora (${ventanaUTC().slice(8)} h UTC)` : "Incidentes de hoy";
    $("#lg-lista").innerHTML = visibles.length
      ? `<table class="logs"><thead><tr><th>Hora</th><th>Nivel</th><th>Origen</th><th>Detalle</th></tr></thead><tbody>${visibles.slice(0, 500).map(it => `
          <tr class="${nuevos.has(it.id_log) ? "nuevo" : ""}${seleccion && it.request_id === seleccion ? " sel" : ""}">
            <td class="hora mono">${esc(horaLog(it.creado_en))}</td>
            <td><span class="nivel ${esc(it.nivel)}">${esc(it.nivel)}</span></td>
            <td class="origen">${esc(origenLog(it.logger))}</td>
            <td class="detalle">${detalleLog(it)}${it.request_id !== "-" ? `<br><button class="rid mono" data-rid="${esc(it.request_id)}">${esc(it.request_id)}</button>` : ""}</td>
          </tr>`).join("")}</tbody></table>`
      : `<p class="vacio">${vistos.size ? "Ningún log coincide con los filtros." : filtroLogs.modo === "vivo" ? "Todavía no hay logs en esta hora." : "No hubo incidentes hoy."}</p>`;

    const cuenta = (n) => todos.filter(it => it.nivel === n && !it.request_id.startsWith(PREFIJO_VISOR)).length;
    const kpi = (titulo, valor, alerta = false) => `<div class="kpi${alerta ? " alerta" : ""}"><small>${titulo}</small><b>${valor}</b></div>`;
    $("#lg-kpis").innerHTML =
      kpi("En pantalla", visibles.length.toLocaleString("es-AR")) +
      kpi("Advertencias", cuenta("WARNING"), cuenta("WARNING") > 0) +
      kpi("Errores", cuenta("ERROR") + cuenta("CRITICAL"), cuenta("ERROR") + cuenta("CRITICAL") > 0) +
      ($("#lg-kpis").dataset.metricas ?? "");
    document.querySelectorAll("[data-modo]").forEach(b => b.classList.toggle("activo", b.dataset.modo === filtroLogs.modo));
    $("#lg-pausa").textContent = filtroLogs.pausa ? "▶ Reanudar" : "❚❚ Pausar";
  };

  const cargar = async () => {
    if (filtroLogs.pausa || cargando) return;
    cargando = true;
    const gen = generacion;
    try {
      let items;
      if (filtroLogs.modo === "vivo") {
        items = (await apiVisor(`/observabilidad/logs?ventana_hora=${ventanaUTC()}&limit=200`)).items;
      } else {
        const f = fechaUTC();
        const rs = await Promise.all(["WARNING", "ERROR", "CRITICAL"].map(n => apiVisor(`/observabilidad/logs/errores?nivel=${n}&fecha=${f}&limit=200`)));
        items = rs.flatMap(r => r.items);
      }
      if (gen !== generacion || !$("#lg-lista")) return; // cambió el modo o se salió de la pantalla
      nuevos = new Set();
      for (const it of items) {
        if (vistos.has(it.id_log)) continue;
        it._t = Date.parse(it.creado_en);
        vistos.set(it.id_log, it);
        if (!primera) nuevos.add(it.id_log);
      }
      if (vistos.size > 1000) {
        [...vistos.values()].sort((a, b) => b._t - a._t).slice(1000).forEach(it => vistos.delete(it.id_log));
      }
      primera = false;
      $("#lg-estado").textContent = `Actualizado ${new Date().toLocaleTimeString("es-AR", { hour12: false })}`;
      pintar();
      nuevos = new Set(); // el resaltado se anima una sola vez, no en cada repintado
    } catch (e) {
      if ($("#lg-estado")) $("#lg-estado").innerHTML = `<span style="color:var(--err)">Sin conexión con los logs: ${esc(e.message)}</span>`;
      if (!vistos.size && $("#lg-lista")) $("#lg-lista").innerHTML = `<p class="vacio">No se pudieron leer los logs de Cassandra (${esc(e.codigo ?? e.message)}).</p>`;
    } finally { cargando = false; }
  };

  // Contadores del pipeline de logs publicados por la API en /metrics (Prometheus).
  const cargarMetricas = async () => {
    if (filtroLogs.pausa) return;
    try {
      const txt = await apiVisor("/metrics", true);
      const suma = (re) => [...txt.matchAll(re)].reduce((a, m) => a + Number(m[1]), 0);
      const guardados = suma(/^fixture_api_logs_persisted_total (\S+)$/gm);
      const descartados = suma(/^fixture_api_logs_dropped_total\{[^}]*\} (\S+)$/gm);
      const cola = suma(/^fixture_api_logs_queue_size (\S+)$/gm);
      const el = $("#lg-kpis");
      if (!el) return;
      el.dataset.metricas =
        `<div class="kpi" title="fixture_api_logs_persisted_total"><small>Guardados en Cassandra</small><b>${guardados.toLocaleString("es-AR")}</b></div>` +
        `<div class="kpi${descartados ? " alerta" : ""}" title="fixture_api_logs_dropped_total"><small>Descartados</small><b>${descartados.toLocaleString("es-AR")}</b></div>` +
        `<div class="kpi" title="fixture_api_logs_queue_size"><small>En cola</small><b>${cola}</b></div>`;
      pintar();
    } catch { /* /metrics es opcional para el visor */ }
  };

  const reiniciar = () => { generacion++; vistos.clear(); nuevos = new Set(); primera = true; pintar(); cargar(); };
  document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { if (filtroLogs.modo !== b.dataset.modo) { filtroLogs.modo = b.dataset.modo; reiniciar(); } });
  $("#lg-nivel").value = filtroLogs.nivel;
  $("#lg-nivel").onchange = (e) => { filtroLogs.nivel = e.target.value; pintar(); };
  $("#lg-origen").onchange = (e) => { filtroLogs.origen = e.target.value; pintar(); };
  $("#lg-texto").value = filtroLogs.texto;
  $("#lg-texto").oninput = (e) => { filtroLogs.texto = e.target.value; nuevos = new Set(); pintar(); };
  $("#lg-pausa").onclick = () => { filtroLogs.pausa = !filtroLogs.pausa; pintar(); if (!filtroLogs.pausa) { cargar(); cargarMetricas(); } };

  $("#lg-lista").addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-rid]");
    if (!b) return;
    seleccion = b.dataset.rid;
    pintar();
    const cont = $("#lg-traza");
    cont.innerHTML = `<p class="vacio">Cargando traza…</p>`;
    if (window.innerWidth <= 980) cont.scrollIntoView({ behavior: "smooth", block: "start" });
    try {
      const r = await apiVisor(`/observabilidad/logs/request/${encodeURIComponent(seleccion)}?limit=200`);
      const t0 = r.items.length ? Date.parse(r.items[0].creado_en) : 0;
      cont.innerHTML = r.items.length
        ? `<p style="margin:0 0 10px;font-size:13px"><span class="mono">${esc(r.request_id)}</span> · ${r.items.length} evento${r.items.length === 1 ? "" : "s"}</p>
           <ol class="traza">${r.items.map(it => `<li><span class="t mono">+${Date.parse(it.creado_en) - t0} ms</span>
             <div><span class="nivel ${esc(it.nivel)}">${esc(it.nivel)}</span> <span class="origen">${esc(origenLog(it.logger))}</span>
             <div class="detalle">${detalleLog(it)}</div></div></li>`).join("")}</ol>`
        : `<p class="vacio">No hay eventos para ese request ID.</p>`;
    } catch (e) { cont.innerHTML = `<p class="vacio">No se pudo leer la traza: ${esc(e.message)}</p>`; }
  });

  pintar();
  await Promise.all([cargar(), cargarMetricas()]);
  timers.push(setInterval(cargar, 2000), setInterval(cargarMetricas, 4000));
}

// ===================================================================== inicio
restaurarSesion().then(ruta);
</script>
