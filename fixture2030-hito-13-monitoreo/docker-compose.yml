name: dash

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fixture2030-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/reglas-o-alertas.yml:/etc/prometheus/reglas-o-alertas.yml:ro
      - ${HOME:-.}/docker/data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: fixture2030-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fixture2030
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${HOME:-.}/docker/data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: fixture2030-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
