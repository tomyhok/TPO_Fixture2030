openapi: 3.1.0
info:
  title: Fixture 2030 - API REST integrada
  description: 'Seis lecturas representativas, una por motor: MongoDB, Neo4j,

    Cassandra, Redis, InfluxDB e IRIS. Contratos, validación y errores uniformes.

    La API no escribe datos de dominio. Los endpoints de salud corresponden al Hito 11.

    Todas las respuestas incluyen X-Request-ID. Laboratorio local sin autenticación HTTP.'
  version: 1.1.0
servers:
- url: http://localhost:8000
  description: Notebook (local)
paths:
  /equipos/{codigo_iso}:
    get:
      tags:
      - Equipos (MongoDB)
      summary: Ficha de una selección
      operationId: obtener_equipo_equipos__codigo_iso__get
      parameters:
      - name: codigo_iso
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código de la selección (3 letras).
          examples:
          - ARG
          title: Codigo Iso
        description: Código de la selección (3 letras).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipoDetalle'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              example:
                error:
                  codigo: RECURSO_NO_ENCONTRADO
                  mensaje: No existe la selección 'XYZ'.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{codigo_partido}/eventos:
    get:
      tags:
      - Eventos (Neo4j)
      summary: Eventos de un partido
      operationId: eventos_partido_partidos__codigo_partido__eventos_get
      parameters:
      - name: codigo_partido
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{3}$
          description: Código de negocio del partido.
          examples:
          - P-001
          title: Codigo Partido
        description: Código de negocio del partido.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventosPartido'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              example:
                error:
                  codigo: RECURSO_NO_ENCONTRADO
                  mensaje: No existe la selección 'XYZ'.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{codigo_partido}/comentarios:
    get:
      tags:
      - Comentarios (Cassandra)
      summary: CU08 - Muro de comentarios de un partido (una ventana de 1 minuto)
      description: 'Lee las 4 particiones `(id_partido, ventana, shard)` de la ventana pedida y las combina
        del más reciente al más viejo. Para la página siguiente se envía `cursor` con el valor de `cursor_siguiente`.
        Una ventana sin comentarios devuelve `items: []`; no se verifica que el partido exista en otra
        fuente.'
      operationId: muro_partidos__codigo_partido__comentarios_get
      parameters:
      - name: codigo_partido
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{3}$
          description: Código de negocio del partido.
          examples:
          - P-001
          title: Codigo Partido
        description: Código de negocio del partido.
      - name: ventana
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{12}$
          description: Minuto AAAAMMDDHHMM (UTC).
          examples:
          - '203006152016'
          title: Ventana
        description: Minuto AAAAMMDDHHMM (UTC).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          - type: 'null'
          description: cursor_siguiente.
          title: Cursor
        description: cursor_siguiente.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuroComentarios'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /sesiones/{id_sesion}:
    get:
      tags:
      - Sesiones (Redis)
      summary: CU10 - Validar una sesión
      description: Lee `sesion:<id>` y su TTL. Una sesión inexistente o expirada responde 404 `SESION_NO_VIGENTE`
        (Redis borra la clave al expirar, así que ambos casos son iguales). Redis caído responde 503/504.
        La lectura no renueva el TTL.
      operationId: obtener_sesion_sesiones__id_sesion__get
      parameters:
      - name: id_sesion
        in: path
        required: true
        schema:
          type: string
          pattern: ^S-\d{4,}$
          description: Identificador opaco de la sesión.
          examples:
          - S-0001
          title: Id Sesion
        description: Identificador opaco de la sesión.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              example:
                error:
                  codigo: SESION_NO_VIGENTE
                  mensaje: No existe una sesión vigente con id 'S-9999'.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{codigo_partido}/estadisticas:
    get:
      tags:
      - Estadísticas (InfluxDB)
      summary: CU12 - Estadísticas en vivo por ventana temporal
      description: 'Intervalo `[desde, hasta)` en UTC, de 3 horas como máximo, agregado con `date_bin`
        a la resolución pedida (10s, 1m o 5m): AVG(posesion_pct), MAX(pases_completados), MAX(tiros) y
        MAX(usuarios_activos). Máximo 1.081 puntos por equipo. Sin puntos en la ventana: 200 con `series:
        []`.'
      operationId: estadisticas_partidos__codigo_partido__estadisticas_get
      parameters:
      - name: codigo_partido
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{3}$
          description: Código de negocio del partido.
          examples:
          - P-001
          title: Codigo Partido
        description: Código de negocio del partido.
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inicio, ISO 8601 con zona.
          examples:
          - '2030-06-10T20:00:00Z'
          title: Desde
        description: Inicio, ISO 8601 con zona.
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Fin (excluido), ISO 8601 con zona.
          examples:
          - '2030-06-10T20:30:00Z'
          title: Hasta
        description: Fin (excluido), ISO 8601 con zona.
      - name: resolucion
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Resolucion'
          default: 1m
      - name: equipo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
          description: Filtra un equipo.
          title: Equipo
        description: Filtra un equipo.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasPartido'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos-oficiales/{codigo_partido}:
    get:
      tags:
      - Actas (IRIS)
      summary: Vista del acta persistente
      operationId: obtener_acta_partidos_oficiales__codigo_partido__get
      parameters:
      - name: codigo_partido
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{3}$
          description: Código de negocio del partido.
          examples:
          - P-001
          title: Codigo Partido
        description: Código de negocio del partido.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acta'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              example:
                error:
                  codigo: RECURSO_NO_ENCONTRADO
                  mensaje: No existe la selección 'XYZ'.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /health:
    get:
      tags:
      - Salud
      summary: CU16 - Disponibilidad de las seis fuentes
      description: 'Ejecuta una operación trivial en cada fuente, en paralelo y con el timeout de cada
        adaptador. 200 si todas responden; 503 si al menos una falla, indicando cuál. Consulta las seis
        bases en cada llamada: para sondeos frecuentes usar /health/ready.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: Al menos una fuente no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /health/live:
    get:
      tags:
      - Salud
      summary: Liveness - el proceso de la API responde
      description: No consulta ninguna fuente. Si el proceso está colgado o detenido, no hay respuesta.
      operationId: vida_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vida'
  /health/ready:
    get:
      tags:
      - Salud
      summary: Readiness - la API puede recibir tráfico
      description: Usa el diagnóstico profundo, reutilizado durante HEALTH_CACHE_TTL_S (10 s por defecto).
        200 si al menos una fuente está disponible (cada ruta de una fuente caída responde 503/504 con
        la dependencia identificada); 503 si ninguna lo está. `no_disponibles` lista las fuentes afectadas.
      operationId: preparacion_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preparacion'
        '503':
          description: Ninguna fuente disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preparacion'
  /health/dependencias:
    get:
      tags:
      - Salud
      summary: Diagnóstico de conectividad por fuente
      description: 'Estado de cada fuente: up, down (caída, rechazo, credencial, contexto o timeout),
        degraded (responde más lento que HEALTH_UMBRAL_LENTO_MS), unknown (no se pudo evaluar) o not_configured
        (faltan variables; no se consulta). Responde 200 porque el recurso pedido es el informe: el estado
        de cada fuente va en el cuerpo. El chequeo se reutiliza durante HEALTH_CACHE_TTL_S salvo `refrescar=true`.'
      operationId: dependencias_health_dependencias_get
      parameters:
      - name: refrescar
        in: query
        required: false
        schema:
          type: boolean
          description: Ignora el resultado reutilizado y vuelve a consultar.
          default: false
          title: Refrescar
        description: Ignora el resultado reutilizado y vuelve a consultar.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostico'
components:
  schemas:
    Acta:
      properties:
        codigo_partido:
          type: string
          title: Codigo Partido
        sede:
          type: string
          title: Sede
        fecha:
          type: string
          format: date
          title: Fecha
        estado:
          $ref: '#/components/schemas/EstadoPartido'
        arbitro:
          $ref: '#/components/schemas/Arbitro'
        eventos:
          items:
            $ref: '#/components/schemas/EventoActa'
          type: array
          title: Eventos
      additionalProperties: false
      type: object
      required:
      - codigo_partido
      - sede
      - fecha
      - estado
      - arbitro
      - eventos
      title: Acta
      example:
        arbitro:
          apellido: Tello
          nombre: Facundo
          rango: FIFA
        codigo_partido: P-001
        estado: En Juego
        eventos:
        - descripcion: Gol de ARG-10
          minuto: 23
          tipo: Gol
        fecha: '2030-06-10'
        sede: Estadio Monumental
    Arbitro:
      properties:
        nombre:
          type: string
          title: Nombre
        apellido:
          type: string
          title: Apellido
        rango:
          type: string
          title: Rango
      additionalProperties: false
      type: object
      required:
      - nombre
      - apellido
      - rango
      title: Arbitro
    Comentario:
      properties:
        id_comentario:
          type: string
          title: Id Comentario
          description: 'timeuuid: identidad y orden temporal del comentario.'
        codigo_partido:
          type: string
          title: Codigo Partido
        ventana:
          type: string
          title: Ventana
          description: Bucket de 1 minuto AAAAMMDDHHMM (parte de la clave de partición).
        id_usuario:
          type: string
          title: Id Usuario
        usuario_alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuario Alias
        equipo_apoyado:
          anyOf:
          - type: string
          - type: 'null'
          title: Equipo Apoyado
        texto:
          type: string
          title: Texto
        idioma:
          anyOf:
          - type: string
          - type: 'null'
          title: Idioma
        estado_moderacion:
          type: string
          title: Estado Moderacion
        minuto_partido:
          anyOf:
          - type: integer
          - type: 'null'
          title: Minuto Partido
        creado_en:
          type: string
          format: date-time
          title: Creado En
      additionalProperties: false
      type: object
      required:
      - id_comentario
      - codigo_partido
      - ventana
      - id_usuario
      - texto
      - estado_moderacion
      - creado_en
      title: Comentario
    Dependencia:
      properties:
        nombre:
          type: string
          title: Nombre
        estado:
          $ref: '#/components/schemas/EstadoDependencia'
        latencia_ms:
          type: number
          title: Latencia Ms
      additionalProperties: false
      type: object
      required:
      - nombre
      - estado
      - latencia_ms
      title: Dependencia
    Diagnostico:
      properties:
        estado:
          $ref: '#/components/schemas/EstadoComponente'
          description: '`up`, `degraded` (alguna fuente afectada) o `down` (ninguna disponible).'
        verificado_en:
          type: string
          format: date-time
          title: Verificado En
          description: Instante (UTC) del chequeo profundo que se informa.
        desde_cache:
          type: boolean
          title: Desde Cache
          description: true si se reutilizó un chequeo previo dentro del TTL.
        edad_s:
          type: number
          title: Edad S
          description: Antigüedad del chequeo informado.
        ttl_cache_s:
          type: number
          title: Ttl Cache S
        dependencias:
          items:
            $ref: '#/components/schemas/DiagnosticoDependencia'
          type: array
          title: Dependencias
      additionalProperties: false
      type: object
      required:
      - estado
      - verificado_en
      - desde_cache
      - edad_s
      - ttl_cache_s
      - dependencias
      title: Diagnostico
    DiagnosticoDependencia:
      properties:
        nombre:
          type: string
          title: Nombre
        estado:
          $ref: '#/components/schemas/EstadoComponente'
        motivo:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo
          description: 'Código del problema: DEPENDENCIA_NO_DISPONIBLE, DEPENDENCIA_TIMEOUT, LATENCIA_ALTA,
            FALTA_CONFIGURACION:<variables> o ERROR_INESPERADO. Nunca incluye hosts ni credenciales.'
        latencia_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latencia Ms
          description: Duración del chequeo; null si no se ejecutó.
      additionalProperties: false
      type: object
      required:
      - nombre
      - estado
      title: DiagnosticoDependencia
    EquipoDetalle:
      properties:
        codigo_iso:
          type: string
          title: Codigo Iso
        nombre:
          type: string
          title: Nombre
        confederacion:
          type: string
          title: Confederacion
        grupo:
          type: string
          title: Grupo
        ranking_fifa:
          type: integer
          title: Ranking Fifa
        director_tecnico:
          anyOf:
          - type: string
          - type: 'null'
          title: Director Tecnico
        pais_anfitrion:
          type: boolean
          title: Pais Anfitrion
      additionalProperties: false
      type: object
      required:
      - codigo_iso
      - nombre
      - confederacion
      - grupo
      - ranking_fifa
      - pais_anfitrion
      title: EquipoDetalle
    ErrorCuerpo:
      properties:
        codigo:
          type: string
          title: Codigo
          description: Tipo de problema, estable para el consumidor.
        mensaje:
          type: string
          title: Mensaje
          description: Descripción apta para el consumidor, sin detalle técnico.
        request_id:
          type: string
          title: Request Id
          description: Identificador para correlacionar con los logs.
        detalles:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Detalles
      additionalProperties: false
      type: object
      required:
      - codigo
      - mensaje
      - request_id
      title: ErrorCuerpo
    ErrorRespuesta:
      properties:
        error:
          $ref: '#/components/schemas/ErrorCuerpo'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorRespuesta
      example:
        error:
          codigo: RECURSO_NO_ENCONTRADO
          detalles: []
          mensaje: No existe la selección 'XYZ'.
          request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
    EstadisticasPartido:
      properties:
        codigo_partido:
          type: string
          title: Codigo Partido
        desde:
          type: string
          format: date-time
          title: Desde
        hasta:
          type: string
          format: date-time
          title: Hasta
        resolucion:
          $ref: '#/components/schemas/Resolucion'
        series:
          items:
            $ref: '#/components/schemas/SerieEquipo'
          type: array
          title: Series
      additionalProperties: false
      type: object
      required:
      - codigo_partido
      - desde
      - hasta
      - resolucion
      - series
      title: EstadisticasPartido
    EstadoComponente:
      type: string
      enum:
      - up
      - down
      - degraded
      - unknown
      - not_configured
      title: EstadoComponente
      description: Significado fijo de cada estado (Hito 11, sección 5.6).
    EstadoDependencia:
      type: string
      enum:
      - ok
      - caida
      - timeout
      title: EstadoDependencia
    EstadoPartido:
      type: string
      enum:
      - Programado
      - En Juego
      - Finalizado
      title: EstadoPartido
    EventoActa:
      properties:
        minuto:
          type: integer
          title: Minuto
        tipo:
          type: string
          title: Tipo
        descripcion:
          anyOf:
          - type: string
          - type: 'null'
          title: Descripcion
      additionalProperties: false
      type: object
      required:
      - minuto
      - tipo
      title: EventoActa
    EventoGrafo:
      properties:
        id_evento:
          type: string
          title: Id Evento
        tipo:
          type: string
          title: Tipo
        minuto:
          type: integer
          title: Minuto
        jugador:
          anyOf:
          - $ref: '#/components/schemas/Protagonista'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - id_evento
      - tipo
      - minuto
      title: EventoGrafo
    EventosPartido:
      properties:
        codigo_partido:
          type: string
          title: Codigo Partido
        eventos:
          items:
            $ref: '#/components/schemas/EventoGrafo'
          type: array
          title: Eventos
      additionalProperties: false
      type: object
      required:
      - codigo_partido
      - eventos
      title: EventosPartido
      example:
        codigo_partido: P-001
        eventos:
        - id_evento: EV-001
          jugador:
            id_jugador: ARG-10
            nombre: Andrés Fuentes
          minuto: 23
          tipo: Gol
    MuroComentarios:
      properties:
        codigo_partido:
          type: string
          title: Codigo Partido
        ventana:
          type: string
          title: Ventana
        items:
          items:
            $ref: '#/components/schemas/Comentario'
          type: array
          title: Items
        cursor_siguiente:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor Siguiente
          description: id_comentario del último elemento; null si no hay más en la ventana.
      additionalProperties: false
      type: object
      required:
      - codigo_partido
      - ventana
      - items
      - cursor_siguiente
      title: MuroComentarios
    Preparacion:
      properties:
        listo:
          type: boolean
          title: Listo
          description: true si la API puede atender tráfico (al menos una fuente disponible).
        estado:
          $ref: '#/components/schemas/EstadoComponente'
        disponibles:
          items:
            type: string
          type: array
          title: Disponibles
        no_disponibles:
          items:
            type: string
          type: array
          title: No Disponibles
        verificado_en:
          type: string
          format: date-time
          title: Verificado En
        desde_cache:
          type: boolean
          title: Desde Cache
      additionalProperties: false
      type: object
      required:
      - listo
      - estado
      - disponibles
      - no_disponibles
      - verificado_en
      - desde_cache
      title: Preparacion
    Protagonista:
      properties:
        id_jugador:
          type: string
          title: Id Jugador
        nombre:
          type: string
          title: Nombre
      additionalProperties: false
      type: object
      required:
      - id_jugador
      - nombre
      title: Protagonista
    PuntoEstadistica:
      properties:
        instante:
          type: string
          format: date-time
          title: Instante
          description: Inicio de la ventana de agregación (UTC).
        posesion_pct_prom:
          type: number
          title: Posesion Pct Prom
          description: AVG(posesion_pct) en la ventana.
        pases_completados_max:
          type: integer
          title: Pases Completados Max
          description: MAX del contador acumulado = total al cierre.
        tiros_max:
          type: integer
          title: Tiros Max
          description: MAX del contador acumulado = total al cierre.
        usuarios_activos_max:
          type: integer
          title: Usuarios Activos Max
          description: Pico de usuarios en la ventana.
      additionalProperties: false
      type: object
      required:
      - instante
      - posesion_pct_prom
      - pases_completados_max
      - tiros_max
      - usuarios_activos_max
      title: PuntoEstadistica
    Resolucion:
      type: string
      enum:
      - 10s
      - 1m
      - 5m
      title: Resolucion
    Salud:
      properties:
        estado:
          type: string
          title: Estado
        dependencias:
          items:
            $ref: '#/components/schemas/Dependencia'
          type: array
          title: Dependencias
      additionalProperties: false
      type: object
      required:
      - estado
      - dependencias
      title: Salud
    SerieEquipo:
      properties:
        equipo:
          type: string
          title: Equipo
        puntos:
          items:
            $ref: '#/components/schemas/PuntoEstadistica'
          type: array
          title: Puntos
      additionalProperties: false
      type: object
      required:
      - equipo
      - puntos
      title: SerieEquipo
    Sesion:
      properties:
        id_sesion:
          type: string
          title: Id Sesion
        usuario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuario Id
        rol:
          anyOf:
          - type: string
          - type: 'null'
          title: Rol
        estado:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
        ttl_restante_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ttl Restante S
          description: Segundos hasta que la sesión expire.
      additionalProperties: false
      type: object
      required:
      - id_sesion
      - usuario_id
      - rol
      - estado
      - ttl_restante_s
      title: Sesion
      description: 'Vista pública de la sesión: no incluye dispositivo, páginas vistas ni marcas internas.'
      example:
        estado: activa
        id_sesion: S-0001
        rol: fan
        ttl_restante_s: 1712
        usuario_id: U-0001
    Vida:
      properties:
        estado:
          type: string
          const: up
          title: Estado
          description: 'Siempre `up`: si el proceso no responde, no hay respuesta.'
        version:
          type: string
          title: Version
        activa_desde_s:
          type: number
          title: Activa Desde S
          description: Segundos desde que arrancó el proceso.
      additionalProperties: false
      type: object
      required:
      - estado
      - version
      - activa_desde_s
      title: Vida
