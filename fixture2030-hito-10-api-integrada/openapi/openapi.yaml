  /partidos/{codigo_partido}:
    get:
      tags:
      - Partidos y relaciones (Neo4j)
      summary: CU05 - Ficha de un partido (caché Redis + Neo4j)
      description: 'Cache-aside: primero `cache:partido:<codigo>` en Redis (TTL 300 s); si no está, Cypher
        parametrizado en Neo4j y se guarda en la caché. Si Redis no está disponible la respuesta es degradada
        (`X-Cache: BYPASS`) y se lee directo de Neo4j.'
      operationId: ficha_partido_partidos__codigo_partido__get
      parameters:
      - name: codigo_partido
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{3}$
          description: Código de negocio del partido.
          examples:
          - P-001
          title: Codigo Partido
        description: Código de negocio del partido.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaPartido'
          headers:
            X-Cache:
              description: HIT (Redis), MISS (Neo4j y se cacheó) o BYPASS (Redis caído).
              schema:
                type: string
                enum:
                - HIT
                - MISS
                - BYPASS
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
