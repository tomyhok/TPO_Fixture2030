<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, Segoe UI, Arial, sans-serif">
  <!-- Fondo oscuro estilo Grafana -->
  <rect width="1200" height="760" fill="#111217"/>

  <!-- Barra superior Grafana -->
  <rect x="0" y="0" width="1200" height="48" fill="#181B1F" stroke="#2C3235"/>
  <circle cx="26" cy="24" r="10" fill="#F47A20"/>
  <text x="46" y="29" fill="#F8FAFC" font-size="16" font-weight="700">Fixture Mundial 2030 — Observabilidad y Monitoreo NoSQL (Hito 13)</text>
  <rect x="930" y="12" width="140" height="24" rx="4" fill="#22252B" stroke="#343B40"/>
  <text x="945" y="28" fill="#CBD5E1" font-size="12">Last 15 minutes</text>
  <rect x="1080" y="12" width="95" height="24" rx="4" fill="#22252B" stroke="#343B40"/>
  <text x="1094" y="28" fill="#10B981" font-size="12" font-weight="600">Refresh: 15s</text>

  <!-- FILA 1: Disponibilidad Targets y 6 Motores NoSQL -->
  <text x="20" y="72" fill="#94A3B8" font-size="13" font-weight="700">v  1. Disponibilidad de Targets y Salud de los 6 Motores NoSQL (RF3, RF6, RF7)</text>

  <!-- Panel 1: Targets Prometheus (up) -->
  <rect x="20" y="82" width="370" height="115" rx="6" fill="#181B1F" stroke="#2C3235"/>
  <text x="32" y="102" fill="#E2E8F0" font-size="12" font-weight="600">Targets Prometheus (up)</text>
  <rect x="32" y="112" width="108" height="72" rx="4" fill="#065F46"/>
  <text x="86" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">prometheus</text>
  <text x="86" y="166" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">UP (1)</text>
  <rect x="146" y="112" width="112" height="72" rx="4" fill="#065F46"/>
  <text x="202" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">node-exporter</text>
  <text x="202" y="166" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">UP (1)</text>
  <rect x="264" y="112" width="114" height="72" rx="4" fill="#065F46"/>
  <text x="321" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">fixture-api</text>
  <text x="321" y="166" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">UP (1)</text>

  <!-- Panel 2: Estado de Salud por Base de Datos NoSQL (fixture_db_up) -->
  <rect x="405" y="82" width="775" height="115" rx="6" fill="#181B1F" stroke="#2C3235"/>
  <text x="418" y="102" fill="#E2E8F0" font-size="12" font-weight="600">Estado de Salud por Base de Datos NoSQL (fixture_db_up)</text>
  <rect x="418" y="112" width="118" height="72" rx="4" fill="#065F46"/>
  <text x="477" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">mongodb</text>
  <text x="477" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">OPERATIVO (1)</text>
  <rect x="544" y="112" width="118" height="72" rx="4" fill="#065F46"/>
  <text x="603" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">neo4j</text>
  <text x="603" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">OPERATIVO (1)</text>
  <rect x="670" y="112" width="118" height="72" rx="4" fill="#065F46"/>
  <text x="729" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">cassandra</text>
  <text x="729" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">OPERATIVO (1)</text>
  <rect x="796" y="112" width="118" height="72" rx="4" fill="#065F46"/>
  <text x="855" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">redis</text>
  <text x="855" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">OPERATIVO (1)</text>
  <rect x="922" y="112" width="118" height="72" rx="4" fill="#065F46"/>
  <text x="981" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">influxdb</text>
  <text x="981" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">OPERATIVO (1)</text>
  <rect x="1048" y="112" width="118" height="72" rx="4" fill="#065F46"/>
  <text x="1107" y="138" fill="#D1FAE5" font-size="11" text-anchor="middle">iris</text>
  <text x="1107" y="165" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">OPERATIVO (1)</text>

  <!-- FILA 2: Latencia y Throughput -->
  <text x="20" y="220" fill="#94A3B8" font-size="13" font-weight="700">v  2. Latencia, Volumen de Operaciones (RPS) y Errores de la API Integrada (RF4, RF6, RF8)</text>

  <!-- Panel 3: Latencia HTTP API vs SLA 100ms -->
  <rect x="20" y="230" width="570" height="230" rx="6" fill="#181B1F" stroke="#2C3235"/>
  <text x="32" y="250" fill="#E2E8F0" font-size="12" font-weight="600">Latencia HTTP API por Ruta (p95 y Promedio — SLA &lt; 100ms)</text>
  <!-- Umbral SLA 0.1s (100ms) -->
  <line x1="65" y1="285" x2="570" y2="285" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="455" y="279" fill="#EF4444" font-size="10" font-weight="600">SLA FIFA: 0.100 s (100 ms)</text>
  <text x="30" y="288" fill="#94A3B8" font-size="10">0.10 s</text>
  <text x="30" y="340" fill="#94A3B8" font-size="10">0.05 s</text>
  <text x="30" y="395" fill="#94A3B8" font-size="10">0.00 s</text>
  <line x1="65" y1="395" x2="570" y2="395" stroke="#2C3235"/>
  <!-- Curvas de latencia por ruta debajo del umbral -->
  <polyline fill="none" stroke="#F59E0B" stroke-width="2" points="65,315 150,312 240,318 330,310 420,314 510,312 570,313"/>
  <polyline fill="none" stroke="#38BDF8" stroke-width="2" points="65,358 150,360 240,356 330,359 420,357 510,358 570,357"/>
  <polyline fill="none" stroke="#10B981" stroke-width="2" points="65,388 150,389 240,387 330,388 420,389 510,388 570,388"/>
  <text x="32" y="422" fill="#F59E0B" font-size="11">■ p95 /partidos/{codigo}/comentarios: 78.0 ms</text>
  <text x="310" y="422" fill="#38BDF8" font-size="11">■ p95 /partidos/{codigo}/estadisticas: 35.0 ms</text>
  <text x="32" y="442" fill="#10B981" font-size="11">■ p95 /sesiones/{id_sesion} · /equipos/{iso} · /partidos-oficiales/{codigo}: 2.0 – 6.5 ms</text>

  <!-- Panel 4: Volumen de Operaciones / Throughput HTTP -->
  <rect x="610" y="230" width="570" height="230" rx="6" fill="#181B1F" stroke="#2C3235"/>
  <text x="622" y="250" fill="#E2E8F0" font-size="12" font-weight="600">Volumen de Operaciones / Throughput HTTP (req/s por Ruta y Estado)</text>
  <line x1="650" y1="395" x2="1160" y2="395" stroke="#2C3235"/>
  <polyline fill="none" stroke="#10B981" stroke-width="2" points="650,340 730,320 810,315 890,322 970,310 1050,318 1160,312"/>
  <polyline fill="none" stroke="#60A5FA" stroke-width="2" points="650,362 730,355 810,350 890,358 970,348 1050,352 1160,350"/>
  <polyline fill="none" stroke="#EF4444" stroke-width="2" points="650,394 730,394 810,394 890,365 930,365 970,394 1160,394"/>
  <text x="622" y="422" fill="#10B981" font-size="11">■ GET /equipos/{codigo_iso} [HTTP 200]</text>
  <text x="900" y="422" fill="#60A5FA" font-size="11">■ GET /partidos/{codigo}/eventos [HTTP 200]</text>
  <text x="622" y="442" fill="#EF4444" font-size="11">■ GET /sesiones/{id_sesion} [HTTP 503 durante prueba controlada]</text>

  <!-- FILA 3: Comparacion entre Subsistemas NoSQL y Errores -->
  <text x="20" y="485" fill="#94A3B8" font-size="13" font-weight="700">v  3. Comparación entre Subsistemas NoSQL, Errores e Infraestructura (RF6, RF7)</text>

  <!-- Panel 5: Comparación de Latencia por Base de Datos NoSQL -->
  <rect x="20" y="495" width="570" height="245" rx="6" fill="#181B1F" stroke="#2C3235"/>
  <text x="32" y="515" fill="#E2E8F0" font-size="12" font-weight="600">Comparación de Latencia por Base de Datos NoSQL (fixture_db_operation_duration_seconds)</text>
  <!-- Barras comparativas de los 6 motores -->
  <text x="35" y="550" fill="#CBD5E1" font-size="12">redis (leer_sesion)</text>
  <rect x="210" y="538" width="18" height="16" rx="2" fill="#10B981"/>
  <text x="236" y="550" fill="#10B981" font-size="12" font-weight="600">1.2 ms</text>

  <text x="35" y="580" fill="#CBD5E1" font-size="12">iris (obtener_acta)</text>
  <rect x="210" y="568" width="32" height="16" rx="2" fill="#38BDF8"/>
  <text x="250" y="580" fill="#38BDF8" font-size="12" font-weight="600">3.3 ms</text>

  <text x="35" y="610" fill="#CBD5E1" font-size="12">mongodb (obtener_equipo)</text>
  <rect x="210" y="598" width="35" height="16" rx="2" fill="#34D399"/>
  <text x="253" y="610" fill="#34D399" font-size="12" font-weight="600">3.5 ms</text>

  <text x="35" y="640" fill="#CBD5E1" font-size="12">neo4j (eventos_partido)</text>
  <rect x="210" y="628" width="52" height="16" rx="2" fill="#818CF8"/>
  <text x="270" y="640" fill="#818CF8" font-size="12" font-weight="600">5.9 ms</text>

  <text x="35" y="670" fill="#CBD5E1" font-size="12">influxdb (serie_partido)</text>
  <rect x="210" y="658" width="150" height="16" rx="2" fill="#FBBF24"/>
  <text x="368" y="670" fill="#FBBF24" font-size="12" font-weight="600">34.2 ms</text>

  <text x="35" y="700" fill="#CBD5E1" font-size="12">cassandra (leer_muro)</text>
  <rect x="210" y="688" width="290" height="16" rx="2" fill="#F97316"/>
  <text x="508" y="700" fill="#F97316" font-size="12" font-weight="600">77.2 ms</text>

  <!-- Panel 6: Errores por Flujo + Infraestructura Node Exporter -->
  <rect x="610" y="495" width="570" height="245" rx="6" fill="#181B1F" stroke="#2C3235"/>
  <text x="622" y="515" fill="#E2E8F0" font-size="12" font-weight="600">Errores por Código Semántico e Infraestructura del Nodo (node-exporter)</text>
  <rect x="625" y="532" width="260" height="90" rx="4" fill="#22252B"/>
  <text x="638" y="552" fill="#94A3B8" font-size="11">ERRORES HTTP POR CÓDIGO</text>
  <text x="638" y="575" fill="#EF4444" font-size="12" font-weight="600">DEPENDENCIA_NO_DISPONIBLE (redis): 3</text>
  <text x="638" y="595" fill="#F59E0B" font-size="12">VALIDACION_ERROR (400): 1</text>
  <text x="638" y="613" fill="#38BDF8" font-size="12">RECURSO_NO_ENCONTRADO (404): 1</text>

  <rect x="900" y="532" width="265" height="90" rx="4" fill="#22252B"/>
  <text x="914" y="552" fill="#94A3B8" font-size="11">INFRAESTRUCTURA HOST (NODE-EXPORTER)</text>
  <text x="914" y="580" fill="#10B981" font-size="18" font-weight="700">CPU: 18.4%   |   RAM: 54.2%</text>
  <text x="914" y="605" fill="#CBD5E1" font-size="11">Umbral Warn: 75% · Crit: 90%</text>

  <rect x="625" y="635" width="540" height="90" rx="4" fill="#22252B"/>
  <text x="638" y="655" fill="#94A3B8" font-size="11">OPERACIONES TOTALES POR SUBSISTEMA (fixture_db_operations_total)</text>
  <text x="638" y="680" fill="#E2E8F0" font-size="12">mongodb [ok]: 8   |   neo4j [ok]: 5   |   cassandra [ok]: 5   |   influxdb [ok]: 5   |   iris [ok]: 5</text>
  <text x="638" y="702" fill="#10B981" font-size="12">redis [ok]: 6</text>
  <text x="760" y="702" fill="#EF4444" font-size="12" font-weight="600">|   redis [DEPENDENCIA_NO_DISPONIBLE]: 3 (Falla controlada)</text>
</svg>
