      summary: CU09 - Publicar un comentario
      description: 'Escribe en `comentarios_por_partido` y `comentarios_por_usuario` (BATCH logged). Exige
        `Idempotency-Key`: repetir la request con la misma clave y el mismo cuerpo devuelve 200 con el
        mismo comentario y `Idempotent-Replayed: true`, sin duplicarlo.'
      operationId: publicar_partidos__codigo_partido__comentarios_post
      parameters:
      - name: codigo_partido
        in: path
        required: true
        schema:
          type: string
