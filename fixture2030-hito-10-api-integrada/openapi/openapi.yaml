openapi: 3.1.0
info:
  title: Fixture 2030 - API REST integrada
  description: '

    API REST que integra los módulos NoSQL del Fixture Mundial 2030. Cada ruta resuelve un

    caso de uso documentado en `docs/casos_de_uso.md` y llega a la fuente que le corresponde

    mediante un adaptador propio:


    | Módulo | Fuente | Hito |

    |---|---|---|

    | Equipos y jugadores | MongoDB | 4 |

    | Partidos, eventos y relaciones | Neo4j | 5 |

    | Comentarios | Cassandra | 6 |

    | Sesiones y caché | Redis | 7 |

    | Estadísticas temporales | InfluxDB 3 | 8 |

    | Actas oficiales | InterSystems IRIS | 9 |


    **Errores.** Todas las respuestas de error usan el esquema `ErrorRespuesta`. Toda respuesta

    incluye el header `X-Request-ID` (se reutiliza el que envía el cliente si es válido), que

    también aparece en los logs de la ruta y del adaptador.


    **Autenticación.** No implementada en este hito: la API se ejecuta en el laboratorio local.

    '
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Notebook (local)
paths:
  /equipos:
    get:
      tags:
      - Equipos y jugadores (MongoDB)
      summary: CU02 - Listar selecciones por ranking FIFA
      operationId: listar_equipos_equipos_get
      parameters:
      - name: confederacion
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Confederacion'
          - type: 'null'
          title: Confederacion
      - name: grupo
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Grupo'
          - type: 'null'
          title: Grupo
      - name: page
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEquipos'
        '400':
          description: 'Validación: parámetro de ruta, query o cuerpo inválido. No se consulta ninguna
            base.'
          content:
            application/json:
              example:
                error:
                  codigo: VALIDACION
                  mensaje: La solicitud tiene parámetros o cuerpo inválidos.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - campo: path.codigo_iso
                    mensaje: String should match pattern '^[A-Z]{3}$'
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Una fuente de datos no está disponible.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_NO_DISPONIBLE
                  mensaje: La fuente de datos 'mongodb' no está disponible.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: mongodb
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: Una fuente de datos no respondió dentro del timeout.
          content:
            application/json:
              example:
                error:
                  codigo: DEPENDENCIA_TIMEOUT
                  mensaje: La fuente de datos 'neo4j' no respondió dentro del tiempo límite.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles:
                  - dependencia: neo4j
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: 'Error interno seguro: el detalle técnico queda solo en el log.'
          content:
            application/json:
              example:
                error:
                  codigo: ERROR_INTERNO
                  mensaje: Ocurrió un error inesperado. Informe el request_id.
                  request_id: 7f3c1a2e-0b4d-4c55-9a51-2f0f3c9e8d10
                  detalles: []
