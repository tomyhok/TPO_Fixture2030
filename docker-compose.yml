services:
  mongodb:
    image: mongo:7.0
    container_name: fixture2030-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: fixture2030
    volumes:
      - mongodb_data:/data/db
      - ./fixture2030-mongoDB/init-scripts:/docker-entrypoint-initdb.d
      - ./fixture2030-mongoDB/schemas:/schemas:ro
      - ./fixture2030-mongoDB/queries:/queries:ro

  neo4j:
    image: neo4j:latest
    container_name: fixture2030-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    environment:
      NEO4J_AUTH: neo4j/fixture2030
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_apoc_import_file_enabled: "true"

  cassandra:
    image: cassandra:latest
    container_name: fixture2030-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: Fixture2030_Cassandra
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 512M
    volumes:
      - ~/docker/data/cassandra:/var/lib/cassandra
      - ./fixture2030-cassandra/scripts:/scripts:ro
      - ./fixture2030-cassandra/tools:/tools:ro
      - ./fixture2030-cassandra/data:/data
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  redis:
    image: redis:latest
    container_name: fixture2030-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - ~/docker/data/redis:/data
      - ./fixture2030-redis/scripts:/scripts:ro

volumes:
  mongodb_data:
    name: fixture_mongodb_data
  neo4j_data:
    name: fixture2030-neo4j_neo4j_data
  neo4j_logs:
    name: fixture2030-neo4j_neo4j_logs
  neo4j_import:
    name: fixture2030-neo4j_neo4j_import
  neo4j_plugins:
    name: fixture2030-neo4j_neo4j_plugins